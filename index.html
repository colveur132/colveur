<!DOCTYPE html>
<html lang="fr" style="--col-base-width: 626px;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Colveur — Portfolio Vidéo</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts : Dela Gothic One (Titres & Logo) + Inter (Interface Éditeur) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Inter:wght@400;500;600;700&amp;display=block" rel="stylesheet">

  <style>
    :root {
      --col-noir: #151515;
      --col-taupe: #b6ab9d;
      --diag-slant: 13vh;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--col-noir);
      font-family: 'Inter', sans-serif;
      color: var(--col-taupe);
    }

    .font-dela {
      font-family: 'Dela Gothic One', cursive, sans-serif;
      letter-spacing: -0.01em;
    }

    /* ==========================================================
       ACCUEIL : CARROUSEL DIAGONAL EN BOUCLE INFINIE & FLÈCHES
       ========================================================== */
    #carousel-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--col-noir);
      cursor: grab;
      z-index: 10;
    }

    #carousel-viewport.is-dragging {
      cursor: grabbing;
    }

    #carousel-track {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      will-change: transform;
    }

    .diag-column {
      position: relative;
      flex-shrink: 0;
      height: 100vh;
      cursor: pointer;
      z-index: 1;
      transition: width 0.42s cubic-bezier(0.22, 1, 0.36, 1), z-index 0s;
    }

    .diag-column.is-hovered {
      z-index: 25;
    }

    /* Mode 2 : Pousser les autres colonnes */
    body[data-hover-mode="push"] #carousel-track.has-hovered .diag-column:not(.is-hovered) {
      width: calc(var(--col-base-width) * 0.91) !important;
    }

    body[data-hover-mode="push"] #carousel-track.has-hovered .diag-column.is-hovered {
      width: calc(var(--col-base-width) * 1.18) !important;
    }

    /* Cadre parallélogramme incliné avec bordures noires nettes */
    .col-skew-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background-color: var(--col-noir);
      border-left: 1.5px solid var(--col-noir);
      border-right: 1.5px solid var(--col-noir);
      transform: skewX(-14deg);
      transform-origin: center center;
      outline: 1px solid transparent;
      backface-visibility: hidden;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.42s ease;
    }

    /* Mode 1 (Défaut) : Manger sur les colonnes voisines */
    body[data-hover-mode="eat"] .diag-column.is-hovered .col-skew-frame {
      transform: skewX(-14deg) scaleX(1.16);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
    }

    /* Mode 3 : Cinéma Hybride */
    body[data-hover-mode="hybrid"] .diag-column.is-hovered .col-skew-frame {
      transform: skewX(-14deg) scaleX(1.11);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
    }

    /* Contre-inclinaison du média pour garder l'image droite sans trous dans les coins */
    .col-unskew-media {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -24%;
      right: -24%;
      transform: skewX(14deg);
      transform-origin: center center;
    }

    .diag-media-layer {
      position: relative;
      width: 100%;
      height: 100%;
      transition: opacity 0.38s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body[data-hover-mode="hybrid"] .diag-column.is-hovered .diag-media-layer {
      transform: scale(1.06);
    }

    .diag-sim-canvas,
    .diag-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Conteneur YouTube sans bandes noires (simule object-fit: cover + recadrage X/Y) */
    .yt-cover-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      background-color: #151515;
    }

    .yt-cover-iframe {
      position: absolute;
      width: 260%;
      height: 260%;
      border: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    /* Dans les pages catégories (Modèle 1 plein écran), adapter au 16:9 de l'écran sans sur-zoom */
    .cat-page-yt-iframe {
      width: max(100vw, 177.78vh) !important;
      height: max(100vh, 56.25vw) !important;
    }

    /* Dans les cadres du Modèle 2, afficher 100% de la vidéo sans zoomer dedans */
    .m2-yt-iframe {
      width: 100% !important;
      height: 100% !important;
    }

    /* Titres des catégories : 100% nets (hors skewX), opacité 100% permanente, zéro glow */
    .diag-title-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
    }

    .diag-title {
      font-family: 'Dela Gothic One', cursive, sans-serif;
      font-size: clamp(1.85rem, 3.2vw, 3.35rem);
      color: var(--col-noir);
      opacity: 1;
      text-shadow: none;
      transform: scale(0.92);
      letter-spacing: -0.01em;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), letter-spacing 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .diag-column.is-hovered .diag-title {
      transform: scale(1.05) translateY(-4px);
      letter-spacing: 0.02em;
    }

    /* Boutons flèches latéraux en gélule (Taupe #b6ab9d + chevron Noir #151515, opacité unifiée 40% -> 100%) */
    .carousel-arrow-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 148px;
      border-radius: 9999px;
      background-color: var(--col-taupe);
      color: var(--col-noir);
      border: none;
      outline: none;
      box-shadow: none;
      opacity: 0.4;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .carousel-arrow-btn.arrow-left {
      left: 14px;
    }

    .carousel-arrow-btn.arrow-right {
      right: 14px;
    }

    .carousel-arrow-btn:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.05);
    }

    .carousel-arrow-btn:active {
      transform: translateY(-50%) scale(0.96);
    }

    .carousel-arrow-btn svg {
      transition: transform 0.25s ease;
    }

    .carousel-arrow-btn.arrow-left:hover svg {
      transform: translateX(-3px);
    }

    .carousel-arrow-btn.arrow-right:hover svg {
      transform: translateX(3px);
    }

    /* Contrôles d'édition sur chaque colonne */
    .editor-overlay-card {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    body.editor-active .editor-overlay-card {
      opacity: 1;
      pointer-events: auto;
    }

    .colveur-slider {
      width: 100%;
      accent-color: var(--col-taupe);
      cursor: pointer;
    }

    /* ==========================================================
       PAGE DE DESTINATION : PAGES PLEIN ÉCRAN ALTERNÉES (TAUPE / NOIR)
       & HEADER FIXE À INVERSION BICOLORE EN TEMPS RÉEL
       ========================================================== */
    #category-page {
      position: fixed;
      inset: 0;
      background-color: var(--col-taupe);
      color: var(--col-noir);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #category-page.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Conteneur de défilement vertical (Scroll Libre ou Scroll Aimanté) */
    #category-scroll-container {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: auto;
    }

    #category-scroll-container.scroll-mode-snap {
      scroll-snap-type: y mandatory;
    }

    /* Chaque page de catégorie fait 100% de l'écran (100vw x 100vh) */
    .cat-page-section {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #category-scroll-container.scroll-mode-snap .cat-page-section {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .cat-page-section.theme-taupe {
      background-color: #b6ab9d;
      color: #151515;
    }

    .cat-page-section.theme-noir {
      background-color: #151515;
      color: #b6ab9d;
    }

    /* Superposition des 2 calques d'en-tête fixe découpés en direct par SVG clipPath */
    .cat-fixed-header-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 132px;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #category-page.header-visible .cat-fixed-header-layer {
      opacity: 1;
      transform: translateY(0);
    }

    .cat-fixed-header-layer.layer-for-taupe {
      clip-path: url(#clip-taupe-header);
      -webkit-clip-path: url(#clip-taupe-header);
    }

    .cat-fixed-header-layer.layer-for-noir {
      clip-path: url(#clip-noir-header);
      -webkit-clip-path: url(#clip-noir-header);
    }

    .cat-back-pill {
      pointer-events: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1.25rem;
      border-radius: 9999px;
      font-family: 'Dela Gothic One', cursive, sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.025em;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.22);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #category-page.header-visible .cat-back-pill {
      pointer-events: auto;
    }

    .cat-back-pill.is-hovered {
      transform: scale(1.05);
    }

    .cat-back-pill:active {
      transform: scale(0.95);
    }

    .cat-back-pill svg {
      transition: transform 0.22s ease;
    }

    .cat-back-pill.is-hovered svg {
      transform: translateX(-4px);
    }

    /* Conteneur du bouton "+ Ajouter une page" en bas (visible uniquement en Mode Éditeur) */
    #category-editor-footer {
      display: none;
    }

    body.editor-active #category-editor-footer {
      display: flex;
    }

    #category-scroll-container.scroll-mode-snap #category-editor-footer {
      scroll-snap-align: end;
    }

    /* ==========================================================
       MODÈLE 2 : CADRES VIDÉO ARRONDIS & ZONES DE TEXTE (LIBRE / CANVA)
       ========================================================== */
    .m2-canvas-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 10;
    }

    /* Repères d'alignement magnétiques au centre en Mode Éditeur */
    .m2-guide-line {
      position: absolute;
      pointer-events: none;
      z-index: 45;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .m2-guide-line.guide-v {
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      border-left: 1px dashed currentColor;
    }

    .m2-guide-line.guide-h {
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      border-top: 1px dashed currentColor;
    }

    .m2-guide-line.is-visible {
      opacity: 0.45;
    }

    .m2-block {
      position: absolute;
      z-index: 15;
      transition: box-shadow 0.2s ease;
    }

    body.editor-active .m2-block {
      cursor: move;
    }

    body.editor-active .m2-block:hover {
      outline: 2px dashed rgba(182, 171, 157, 0.55);
      outline-offset: 4px;
    }

    .cat-page-section.theme-taupe .m2-block:hover {
      outline-color: rgba(21, 21, 21, 0.45);
    }

    body.editor-active .m2-block.is-selected {
      outline: 2px solid #10b981 !important;
      outline-offset: 4px;
      z-index: 30;
    }

    /* Cadre vidéo arrondi : Noir sur fond Taupe, Taupe sur fond Noir */
    .m2-video-frame {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(0);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      transition: background-color 0.3s ease;
    }

    /* Anneau de contour interne qui suit parfaitement les angles arrondis */
    .m2-video-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 16;
    }

    .cat-page-section.theme-taupe .m2-video-frame {
      background-color: #151515;
      color: #b6ab9d;
    }

    .cat-page-section.theme-taupe .m2-video-frame::after {
      box-shadow: inset 0 0 0 2.5px #151515;
    }

    .cat-page-section.theme-noir .m2-video-frame {
      background-color: #b6ab9d;
      color: #151515;
    }

    .cat-page-section.theme-noir .m2-video-frame::after {
      box-shadow: inset 0 0 0 2.5px #b6ab9d;
    }

    /* En plein écran, supprimer l'arrondi et le contour pour occuper 100% de l'écran */
    .m2-video-frame:fullscreen,
    .m2-video-frame:-webkit-full-screen {
      border-radius: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    .m2-video-frame:fullscreen::after,
    .m2-video-frame:-webkit-full-screen::after {
      display: none;
    }

    /* Menu déroulant de la roue crantée (Qualité vidéo) */
    .m2-quality-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .m2-quality-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      background: rgba(21, 21, 21, 0.96);
      border: 1px solid rgba(182, 171, 157, 0.35);
      border-radius: 12px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      min-width: 96px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      z-index: 35;
    }

    .m2-quality-menu.is-open {
      display: flex;
    }

    .m2-quality-opt {
      text-align: left;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #b6ab9d;
      transition: background 0.15s ease;
    }

    .m2-quality-opt:hover {
      background: rgba(182, 171, 157, 0.18);
    }

    .m2-quality-opt.is-active {
      background: #b6ab9d;
      color: #151515;
      font-weight: 700;
    }

    .m2-video-el {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    /* Contrôles lecteur vidéo au survol (Pause, Son, Timeline, Plein écran) */
    .m2-player-controls {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 8px 14px;
      border-radius: 9999px;
      background: rgba(21, 21, 21, 0.82);
      color: #b6ab9d;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    .m2-video-frame:hover .m2-player-controls,
    .m2-video-frame.is-paused .m2-player-controls {
      opacity: 1;
      transform: translateY(0);
    }

    /* Badge indicateur de son au clic sur la vidéo */
    .m2-sound-toast {
      position: absolute;
      top: 16px;
      right: 18px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(21, 21, 21, 0.78);
      color: #b6ab9d;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 18;
    }

    .m2-video-frame:hover .m2-sound-toast {
      opacity: 0.9;
    }

    /* Zone de texte : Dela Gothic One + support Gras / Italique / Souligné */
    .m2-text-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Dela Gothic One', cursive, sans-serif;
      line-height: 1.25;
      word-break: break-word;
      outline: none;
      padding: 8px 12px;
      user-select: text;
      -webkit-user-select: text;
    }

    .cat-page-section.theme-taupe .m2-text-content {
      color: #151515;
    }

    .cat-page-section.theme-noir .m2-text-content {
      color: #b6ab9d;
    }

    /* Effet Gras amplifié pour Dela Gothic One (qui est en 400 natif) */
    .m2-text-content.is-bold,
    .m2-text-content b,
    .m2-text-content strong {
      font-weight: 900;
      -webkit-text-stroke: 0.032em currentColor;
      letter-spacing: 0.015em;
    }

    .m2-text-content.is-italic,
    .m2-text-content i,
    .m2-text-content em {
      font-style: italic;
    }

    .m2-text-content.is-underline,
    .m2-text-content u {
      text-decoration: underline;
      text-underline-offset: 0.14em;
      text-decoration-thickness: 0.08em;
    }

    /* Poignées de redimensionnement (visibles uniquement en Mode Éditeur) */
    .m2-resize-handle {
      display: none;
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      background-color: #10b981;
      border: 2px solid #151515;
      z-index: 40;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }

    body.editor-active .m2-block:hover .m2-resize-handle,
    body.editor-active .m2-block.is-selected .m2-resize-handle {
      display: block;
    }

    .m2-resize-handle.handle-nw { top: -7px; left: -7px; cursor: nwse-resize; }
    .m2-resize-handle.handle-ne { top: -7px; right: -7px; cursor: nesw-resize; }
    .m2-resize-handle.handle-sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
    .m2-resize-handle.handle-se { bottom: -7px; right: -7px; cursor: nwse-resize; }
    .m2-resize-handle.handle-e  { top: 50%; right: -7px; transform: translateY(-50%); cursor: ew-resize; }
    .m2-resize-handle.handle-s  { bottom: -7px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }

    /* Barre d'outils flottante au-dessus du bloc sélectionné en Mode Éditeur */
    .m2-block-toolbar {
      display: none;
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 21, 21, 0.96);
      color: #b6ab9d;
      border: 1px solid rgba(182, 171, 157, 0.4);
      border-radius: 14px;
      padding: 6px 10px;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
      z-index: 55;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }

    /* Si le bloc est très haut dans la page, afficher sa barre d'outils en dessous */
    .m2-block.toolbar-below .m2-block-toolbar {
      bottom: auto;
      top: calc(100% + 10px);
    }

    body.editor-active .m2-block.is-selected .m2-block-toolbar {
      display: flex;
    }

    /* ==========================================================
       CANVAS D'INTRO "COLVEUR" (3 SECONDES OU CLIC DIRECT -> ZOOM DANS LE "V")
       ========================================================== */
    #intro-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: all;
      cursor: pointer;
      display: block;
    }

    #intro-canvas.is-hidden {
      display: none;
      pointer-events: none;
    }

    /* Petit texte informatif en bas de l'écran d'intro qui pulse lentement */
    @keyframes slowFlicker {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.75; }
    }

    #intro-bottom-hint {
      position: fixed;
      bottom: 2.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 105;
      pointer-events: none;
      color: var(--col-noir);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      animation: slowFlicker 2.4s ease-in-out infinite;
      transition: opacity 0.2s ease;
    }

    #intro-bottom-hint.is-hidden {
      opacity: 0 !important;
      animation: none;
      display: none;
    }
  </style>
</head>
<body data-hover-mode="eat" class="">

  <!-- =====================================================================
       1. ÉCRAN D'INTRODUCTION "COLVEUR" (3 SECONDES OU CLIC -> ZOOM DANS LE "V")
       ===================================================================== -->
  <canvas id="intro-canvas" width="3756" height="2000" class="is-hidden"></canvas>

    /**
     * Détecte et extrait l'identifiant d'une vidéo YouTube (watch?v=, youtu.be/, shorts/, embed/)
     */
    function extractYouTubeId(url) {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();
      const regExp = /(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = trimmed.match(regExp);
      return match ? match[1] : null;
    }

    /**
     * Indique si un média du carrousel d'accueil est une photo (.jpg, .png, .webp...)
     * plutôt qu'une vidéo. Gère aussi les fichiers choisis sur l'ordinateur et pas encore publiés.
     */
    function isImageMediaUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const str = url.trim();
      if (str.startsWith('blob:')) {
        const item = pendingVideoUploads[str];
        return Boolean(item && item.file && /^image\//i.test(item.file.type || ''));
      }
      if (/^data:image\//i.test(str)) return true;
      const path = str.split('#')[0].split('?')[0];
      return /\.(jpe?g|png|webp|gif|avif)$/i.test(path);
    }

    function buildYouTubeEmbedUrl(ytId, autoplay = false) {
      if (!ytId) return '';
      let originParam = '';
      try {
        if (window.location && window.location.origin && /^https?:\/\//i.test(window.location.origin)) {
          originParam = `&origin=${encodeURIComponent(window.location.origin)}&widget_referrer=${encodeURIComponent(window.location.href)}`;
        }
      } catch (e) {}
      return `https://www.youtube.com/embed/${ytId}?enablejsapi=1&autoplay=${autoplay ? 1 : 0}&mute=1&loop=1&playlist=${ytId}&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1${originParam}`;
    }

    function sendYouTubeCommand(iframeEl, funcName, args = []) {
      if (!iframeEl || !iframeEl.contentWindow) return;
      try {
        iframeEl.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: funcName,
          args: args
        }), '*');
      } catch (e) {}
    }

      }
      if (b.type === 'image') {

          imageUrl: typeof b.imageUrl === 'string' ? b.imageUrl : '',
          linkUrl: typeof b.linkUrl === 'string' ? b.linkUrl : ''
        };
      }
      if (b.type === 'embed') {
        return {
          id: b.id || ('blk-web-' + Math.random().toString(36).slice(2, 8)),
          type: 'embed',
          x: typeof b.x === 'number' ? b.x : 38,
          y: typeof b.y === 'number' ? b.y : 14,
          w: typeof b.w === 'number' ? b.w : 24,
          h: typeof b.h === 'number' ? b.h : 72,
          embedUrl: typeof b.embedUrl === 'string' ? b.embedUrl : '',
          borderRadius: typeof b.borderRadius === 'number' ? b.borderRadius : 24
        };
      }
      if (b.type === 'text') {
        return {
          id: b.id || ('blk-txt-' + Math.random().toString(36).slice(2, 8)),
          type: 'text',
          x: typeof b.x === 'number' ? b.x : 58,
          y: typeof b.y === 'number' ? b.y : 44,
          w: typeof b.w === 'number' ? b.w : 32,
          h: typeof b.h === 'number' ? b.h : 18,

          fontSize: typeof b.fontSize === 'number' ? b.fontSize : 28,
          bold: Boolean(b.bold),
          italic: Boolean(b.italic),
          underline: Boolean(b.underline),
          align: (b.align === 'left' || b.align === 'right' || b.align === 'center') ? b.align : 'center'
        };
      }
      return {
        id: b.id || ('blk-vid-' + Math.random().toString(36).slice(2, 8)),
        type: 'video',
        x: typeof b.x === 'number' ? b.x : 6.2,
        y: typeof b.y === 'number' ? b.y : 33.5,
        w: typeof b.w === 'number' ? b.w : 39.8,
        h: typeof b.h === 'number' ? b.h : 41.5,
        borderRadius: typeof b.borderRadius === 'number' ? b.borderRadius : 42,
        videoUrl: (b.videoUrl && !String(b.videoUrl).startsWith('blob:')) ? b.videoUrl : (b.videoUrl || ''),
        posX: typeof b.posX === 'number' ? b.posX : 50,
        posY: typeof b.posY === 'number' ? b.posY : 50
      };
    }

    function normalizePageObject(page, index) {
      let tpl = 'blank';
      if (page && page.template === 'fullscreen-video') tpl = 'fullscreen-video';
      else if (page && page.template === 'media-text') tpl = 'media-text';

      const defaultTheme = tpl === 'fullscreen-video' ? 'noir' : (index % 2 === 0 ? 'taupe' : 'noir');
      const bgTheme = (page && (page.bgTheme === 'taupe' || page.bgTheme === 'noir')) ? page.bgTheme : defaultTheme;

      const titleMap = {
        'blank': 'Page vierge (Fond uni)',
        'fullscreen-video': 'Modèle 1 : Vidéo Plein Écran',
        'media-text': 'Modèle 2 : Cadre Vidéo & Texte'
      };

      const rawBlocks = (page && Array.isArray(page.blocks) && page.blocks.length > 0)
        ? page.blocks.map((b, bIdx) => normalizeM2Block(b, bIdx))
        : createDefaultM2Blocks();

      return {
        id: (page && page.id) ? page.id : ('page-' + Math.random().toString(36).slice(2, 9)),
        template: tpl,
        title: titleMap[tpl],
        bgTheme,
        videoUrl: (page && page.videoUrl) ? page.videoUrl : '',

        videoVolume: (page && typeof page.videoVolume === 'number') ? page.videoVolume : 80,
        videoMuted: (page && typeof page.videoMuted === 'boolean') ? page.videoMuted : false,
        blocks: rawBlocks,
        // Blocs posés librement sur une page « Fond uni » (vide par défaut)
        freeBlocks: (page && Array.isArray(page.freeBlocks))
          ? page.freeBlocks.filter(b => b && typeof b === 'object').map((b, bIdx) => normalizeM2Block(b, bIdx))
          : []
      };
    }

    /**
     * Champs d'un bloc qui pointent vers un fichier média (vidéo ou image).
     * Sert à remplacer les fichiers choisis sur l'ordinateur par leur chemin définitif sur le site.
     */
    const BLOCK_MEDIA_FIELDS = ['videoUrl', 'imageUrl'];

    function mapBlockMedia(block, fn) {
      const out = { ...block };
      BLOCK_MEDIA_FIELDS.forEach(key => {
        if (typeof out[key] === 'string') out[key] = fn(out[key]);
      });
      return out;
    }

    function dropBlobUrl(url) {
      return (url && !String(url).startsWith('blob:')) ? url : '';
    }

    /** Lien externe sûr (http/https uniquement). Accepte « tiktok.com/@x » ou « @x » (TikTok). */
    function safeExternalUrl(url) {
      let u = String(url || '').trim();
      if (!u) return '';
      if (/^@[\w.]+$/.test(u)) u = 'https://www.tiktok.com/' + u;
      if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
      if (!/^https?:\/\//i.test(u)) return '';
      try {
        return new URL(u).href;
      } catch (e) {
        return '';
      }
    }

    /**
     * Ce qu'une « fenêtre web » doit afficher : profil TikTok, vidéo TikTok, vidéo YouTube ou autre site.
     */
    function resolveEmbedTarget(rawUrl) {
      const url = safeExternalUrl(rawUrl);
      if (!url) return null;
      let parsed;
      try {
        parsed = new URL(url);
      } catch (e) {
        return null;
      }
      const host = parsed.hostname.toLowerCase().replace(/^(www|m)\./, '');
      if (host === 'tiktok.com') {
        const videoMatch = parsed.pathname.match(/^\/@[\w.]+\/(?:video|photo)\/(\d+)/);
        if (videoMatch) return { kind: 'tiktok-video', id: videoMatch[1], openUrl: url };
        const profileMatch = parsed.pathname.match(/^\/@([\w.]+)\/?$/);
        if (profileMatch) return { kind: 'tiktok-profile', username: profileMatch[1], openUrl: `https://www.tiktok.com/@${profileMatch[1]}` };
      }
      const ytId = extractYouTubeId(url);
      if (ytId) return { kind: 'youtube', id: ytId, openUrl: url };
      return { kind: 'web', url, openUrl: url };
    }

    function buildEmbedIframeHtml(target, isEditor) {
      // En mode éditeur, la fenêtre ne capte pas la souris : on peut la déplacer et la redimensionner
      const attrs = `class="m2-embed-iframe" style="position:absolute; inset:0; width:100%; height:100%; border:0; ${isEditor ? 'pointer-events:none;' : ''}" loading="lazy" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"`;

      if (target.kind === 'tiktok-profile') {
        // Code d'intégration officiel TikTok (profil créateur), isolé dans sa propre petite page
        const u = target.username;
        const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
          '<style>html,body{margin:0;padding:0;background:transparent;}body{display:flex;justify-content:center;}blockquote.tiktok-embed{margin:0 auto !important;}</style></head><body>' +
          `<blockquote class="tiktok-embed" cite="https://www.tiktok.com/@${u}" data-unique-id="${u}" data-embed-type="creator" style="max-width:720px; min-width:288px;">` +
          `<section><a target="_blank" href="https://www.tiktok.com/@${u}?refer=creator_embed">@${u}</a></section></blockquote>` +
          '<script async src="https://www.tiktok.com/embed.js"><\/script></body></html>';
        return `<iframe ${attrs} title="Profil TikTok @${escapeHtml(u)}" srcdoc="${escapeHtml(doc)}"></iframe>`;
      }
      if (target.kind === 'tiktok-video') {
        return `<iframe ${attrs} title="Vidéo TikTok" src="https://www.tiktok.com/player/v1/${target.id}?rel=0&description=1"></iframe>`;
      }
      if (target.kind === 'youtube') {
        return `<iframe ${attrs} title="Vidéo YouTube" src="https://www.youtube.com/embed/${target.id}?rel=0&playsinline=1"></iframe>`;
      }
      return `<iframe ${attrs} title="Site web" src="${escapeHtml(target.url)}"></iframe>`;
    }

    const STORAGE_KEY_PORTFOLIO_BASE = 'colveur_portfolio_base_v1';

    function computeDataSignature(data) {
      const str = JSON.stringify(data);
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash + str.charCodeAt(i)) | 0;
      }
      return str.length + '-' + (hash >>> 0).toString(36);
    }

        videoUrl: (cat.videoUrl && !cat.videoUrl.startsWith('blob:')) ? cat.videoUrl : '',
        posX: typeof cat.posX === 'number' ? cat.posX : 50,
        pages: (Array.isArray(cat.pages) && cat.pages.length > 0)
          ? cat.pages.map((p, pIdx) => normalizePageObject({
              ...p,
              videoUrl: (p && p.videoUrl && !String(p.videoUrl).startsWith('blob:')) ? p.videoUrl : '',
              blocks: Array.isArray(p && p.blocks) ? p.blocks.map((b, bIdx) => mapBlockMedia(normalizeM2Block(b, bIdx), dropBlobUrl)) : undefined,

        try {

           'colveur_editor_secret_pin_v1', 'colveur_github_sync_config_v1'].forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY_PORTFOLIO);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));

        return normalizeCategoryList(parsed);
      } catch (e) {

    const introCanvas = document.getElementById('intro-canvas');

    const introController = {

    function shouldPlayIntroOnLoad() {

    function computeExactVStrokeAnchor(w, h, fontSize) {
      const off = document.createElement('canvas');
      off.width = Math.max(1, Math.floor(w));
      off.height = Math.max(1, Math.floor(h));
      const octx = off.getContext('2d');

      octx.font = `400 ${fontSize}px "Dela Gothic One", sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';

      const fullWidth = octx.measureText('Colveur').width;
      const colWidth = octx.measureText('Col').width;
      const colvWidth = octx.measureText('Colv').width;
      const vWidth = Math.max(10, colvWidth - colWidth);

      const leftEdgeX = w / 2 - fullWidth / 2;
      const vStartX = leftEdgeX + colWidth;

      octx.fillStyle = '#000000';
      octx.fillText('Colveur', w / 2, h / 2);

      let targetX = vStartX + vWidth * 0.76;
      let targetY = h / 2 + fontSize * 0.02;

      try {
        const searchRadii = [0, 2, 4, 6, 8, 12, 16, 20];
        let foundInk = false;
        for (const r of searchRadii) {
          for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
            const testX = Math.round(targetX + Math.cos(angle) * r);
            const testY = Math.round(targetY + Math.sin(angle) * r);
            const alpha = octx.getImageData(testX, testY, 1, 1).data[3];
            const alphaL = octx.getImageData(testX - 3, testY, 1, 1).data[3];
            const alphaR = octx.getImageData(testX + 3, testY, 1, 1).data[3];
            if (alpha > 220 && alphaL > 200 && alphaR > 200) {
              targetX = testX;
              targetY = testY;
              foundInk = true;
              break;
            }
          }
          if (foundInk) break;
        }
      } catch (e) {}

      return {
        offsetX: targetX - w / 2,
        offsetY: targetY - h / 2
      };
    }

    function triggerImmediateZoomFromHold() {
      if (introController.phase === 'HOLD') {
        introController.phase = 'ZOOM';
        introController.phaseStartTime = performance.now();
        if (introBottomHint) introBottomHint.classList.add('is-hidden');
      }
    }

    introCanvas.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      triggerImmediateZoomFromHold();
    });

    introCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      e.stopPropagation();
      triggerImmediateZoomFromHold();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (introController.phase === 'HOLD' && (e.code === 'Space' || e.code === 'Enter')) {
        e.preventDefault();
        triggerImmediateZoomFromHold();
      }
    });

    async function startIntroAnimation(forceReplay = false) {
      if (!forceReplay && !shouldPlayIntroOnLoad()) {
        introController.phase = 'DONE';
        introCanvas.classList.add('is-hidden');
        if (introBottomHint) introBottomHint.classList.add('is-hidden');
        return;
      }

      introController.runId += 1;
      const currentRunId = introController.runId;
      if (introController.rafId) {
        cancelAnimationFrame(introController.rafId);
        introController.rafId = null;
      }

      markIntroAsPlayed();
      introCanvas.classList.remove('is-hidden');
      if (introBottomHint) introBottomHint.classList.remove('is-hidden');

      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (e) {}
      }

      if (currentRunId !== introController.runId) return;

      const HOLD_DURATION = 2300;
      const ZOOM_DURATION = 1100;

      introController.phase = 'HOLD';
      introController.phaseStartTime = performance.now();

      let cachedW = 0;
      let cachedH = 0;
      let cachedAnchor = { offsetX: 0, offsetY: 0 };

      function stepIntro(now) {
        if (currentRunId !== introController.runId) return;

        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = Math.max(2, window.devicePixelRatio || 1);

        if (introCanvas.width !== Math.round(w * dpr) || introCanvas.height !== Math.round(h * dpr)) {
          introCanvas.width = Math.round(w * dpr);
          introCanvas.height = Math.round(h * dpr);
        }

        const baseFontSize = Math.min(w * 0.095, 165);

        if (w !== cachedW || h !== cachedH) {
          cachedW = w;
          cachedH = h;
          cachedAnchor = computeExactVStrokeAnchor(w, h, baseFontSize);
        }

        if (introController.phase === 'HOLD' && (now - introController.phaseStartTime >= HOLD_DURATION)) {
          introController.phase = 'ZOOM';
          introController.phaseStartTime = now;
          if (introBottomHint) introBottomHint.classList.add('is-hidden');
        }

        introCtx.save();
        introCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        introCtx.imageSmoothingEnabled = true;
        introCtx.imageSmoothingQuality = 'high';
        introCtx.font = `400 ${baseFontSize}px "Dela Gothic One", sans-serif`;
        introCtx.textAlign = 'center';
        introCtx.textBaseline = 'middle';

        if (introController.phase === 'HOLD') {
          introCtx.globalCompositeOperation = 'source-over';
          introCtx.fillStyle = '#b6ab9d';
          introCtx.fillRect(0, 0, w, h);

          introCtx.save();
          introCtx.translate(w / 2, h / 2);
          introCtx.translate(-cachedAnchor.offsetX, -cachedAnchor.offsetY);
          introCtx.fillStyle = '#151515';
          introCtx.fillText('Colveur', 0, 0);
          introCtx.restore();

          introCtx.restore();
          introController.rafId = requestAnimationFrame(stepIntro);
        } else if (introController.phase === 'ZOOM') {
          const zoomElapsed = now - introController.phaseStartTime;
          const t = Math.min(1, Math.max(0, zoomElapsed / ZOOM_DURATION));

          const eased = Math.pow(t, 1.75);
          const scale = Math.pow(240, eased);
          const masterAlpha = t > 0.92 ? Math.max(0, 1 - (t - 0.92) / 0.08) : 1;

          introCtx.globalAlpha = masterAlpha;
          introCtx.globalCompositeOperation = 'source-over';
          introCtx.fillStyle = '#b6ab9d';
          introCtx.fillRect(0, 0, w, h);

          introCtx.save();
          introCtx.translate(w / 2, h / 2);
          introCtx.scale(scale, scale);
          introCtx.translate(-cachedAnchor.offsetX, -cachedAnchor.offsetY);

          introCtx.globalCompositeOperation = 'destination-out';
          introCtx.globalAlpha = 1;
          introCtx.fillStyle = '#000000';
          introCtx.fillText('Colveur', 0, 0);

          const blackInkOpacity = Math.max(0, 1 - Math.pow(t / 0.30, 1.2));
          if (blackInkOpacity > 0) {
            introCtx.globalCompositeOperation = 'source-over';
            introCtx.fillStyle = `rgba(21, 21, 21, ${blackInkOpacity})`;
            introCtx.fillText('Colveur', 0, 0);
          }

          introCtx.restore();
          introCtx.restore();

          if (t < 1) {
            introController.rafId = requestAnimationFrame(stepIntro);
          } else {
            introController.phase = 'DONE';
            introController.rafId = null;
            introCanvas.classList.add('is-hidden');
            if (introBottomHint) introBottomHint.classList.add('is-hidden');
          }
        }
      }

      introController.rafId = requestAnimationFrame(stepIntro);
    }

    function replayIntroAnimation() {

    /*************************************************************************

    const simCanvases = [];

    function registerSimCanvas(canvasEl, theme, catId) {
      simCanvases.push({
        canvas: canvasEl,
        ctx: canvasEl.getContext('2d'),
        theme: theme || 'docu',
        catId,
        time: Math.random() * 10,
        isPlaying: false
      });
    }

    function drawProceduralCinemaFrame(item, dt) {
      const { canvas, ctx, theme, catId } = item;
      const cat = categories.find(c => c.id === catId);
      const posXRatio = ((cat ? cat.posX : 50) - 50) / 50;

      const w = 420;
      const h = 640;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      if (item.isPlaying) {
        item.time += dt * 1.4;
      }
      const t = item.time;
      const panOffset = posXRatio * 95;

      ctx.save();

      if (theme === 'docu') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#968c80');
        grad.addColorStop(0.52, '#c8bdb0');
        grad.addColorStop(1, '#59524a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        const sunX = w * 0.52 - panOffset * 0.8 + Math.sin(t * 0.4) * 18;
        const sunY = h * 0.34;
        const radial = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 220);
        radial.addColorStop(0, 'rgba(248, 240, 228, 0.85)');
        radial.addColorStop(1, 'rgba(248, 240, 228, 0)');
        ctx.fillStyle = radial;
        ctx.fillRect(0, 0, w, h);

        for (let layer = 0; layer < 3; layer++) {
          ctx.beginPath();
          const baseY = h * (0.58 + layer * 0.13);
          ctx.moveTo(0, h);
          for (let x = 0; x <= w; x += 20) {
            const worldX = x + panOffset * (0.5 + layer * 0.35) + t * (8 + layer * 6);
            const y = baseY + Math.sin(worldX * 0.012 + layer) * 28 + Math.cos(worldX * 0.027) * 14;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fillStyle = layer === 0 ? '#7d7368' : layer === 1 ? '#5e564e' : '#3d3833';
          ctx.fill();
        }
      } else if (theme === 'event') {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#786d63');
        grad.addColorStop(0.5, '#b6ab9d');
        grad.addColorStop(1, '#4a433d');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 4; i++) {
          const angle = Math.sin(t * 0.9 + i * 1.4) * 0.28;
          const originX = (w * (0.2 + i * 0.22)) - panOffset * 0.6;
          ctx.save();
          ctx.translate(originX, -20);
          ctx.rotate(angle);
          const beam = ctx.createLinearGradient(0, 0, 0, h * 1.1);
          beam.addColorStop(0, 'rgba(245, 236, 224, 0.55)');
          beam.addColorStop(1, 'rgba(245, 236, 224, 0)');
          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(-18, 0);
          ctx.lineTo(18, 0);
          ctx.lineTo(115, h * 1.1);
          ctx.lineTo(-115, h * 1.1);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        for (let p = 0; p < 14; p++) {
          const px = ((p * 73 + t * 28 - panOffset * 0.9) % (w + 60)) - 30;
          const py = ((p * 97 - t * 18) % h + h) % h;
          const radius = 6 + (p % 4) * 5;
          ctx.beginPath();
          ctx.arc(px, py, radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(245, 235, 220, 0.35)';
          ctx.fill();
        }
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#857c72');
        grad.addColorStop(0.5, '#b0a597');
        grad.addColorStop(1, '#524c46');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 9; i++) {
          const y = (h * 0.15) + i * 58;
          const speed = (i % 2 === 0 ? 1 : -1) * (55 + i * 12);
          const trailX = (((i * 90 + t * speed - panOffset) % (w + 220)) + (w + 220)) % (w + 220) - 110;
          const trailGrad = ctx.createLinearGradient(trailX - 90, y, trailX + 90, y);
          trailGrad.addColorStop(0, 'rgba(255,255,255,0)');
          trailGrad.addColorStop(0.5, i % 2 === 0 ? 'rgba(245, 236, 225, 0.65)' : 'rgba(215, 205, 192, 0.5)');
          trailGrad.addColorStop(1, 'rgba(255,255,255,0)');

          ctx.fillStyle = trailGrad;
          ctx.fillRect(trailX - 90, y, 180, 10 + (i % 3) * 6);
        }
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let gx = -1; gx <= 5; gx++) {
        const lineX = gx * 90 - panOffset;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, h);
        ctx.stroke();
      }

      ctx.restore();
    }

    /*************************************************************************
     * 4. CARROUSEL DIAGONAL INFINI (Docu | Event | Réseaux)
     *************************************************************************/
    const viewport = document.getElementById('carousel-viewport');
    const track = document.getElementById('carousel-track');

    const CLONE_SETS = 5;
    let baseColWidth = window.innerWidth / 3;
    let scrollTarget = 0;
    let scrollCurrent = 0;

    let isPointerDown = false;
    let pointerStartX = 0;
    let scrollStartTarget = 0;
    let dragDistance = 0;
    let framingDragCatId = null;
    let framingStartPosX = 50;

    function updateColumnDimensions() {
      const colsVisible = window.innerWidth < 640 ? 1.25 : window.innerWidth < 1024 ? 2 : 3;
      baseColWidth = window.innerWidth / colsVisible;
      document.documentElement.style.setProperty('--col-base-width', `${baseColWidth}px`);

      const allCols = track.querySelectorAll('.diag-column');
      allCols.forEach(col => {
        col.style.width = `${baseColWidth}px`;
      });
    }

    function buildInfiniteCarousel() {
      track.innerHTML = '';
      simCanvases.length = 0;

      const colsVisible = window.innerWidth < 640 ? 1.25 : window.innerWidth < 1024 ? 2 : 3;
      baseColWidth = window.innerWidth / colsVisible;
      document.documentElement.style.setProperty('--col-base-width', `${baseColWidth}px`);

      for (let setIndex = 0; setIndex < CLONE_SETS; setIndex++) {
        categories.forEach((cat, catIndex) => {
          const col = document.createElement('article');
          col.className = 'diag-column';
          col.style.width = `${baseColWidth}px`;
          col.dataset.catId = cat.id;
          col.dataset.setIndex = setIndex;
          col.dataset.catIndex = catIndex;

          const hasCustomVideo = Boolean(cat.videoUrl && cat.videoUrl.trim() !== '');
          const ytId = extractYouTubeId(cat.videoUrl);
          const isYouTube = Boolean(ytId);
          const isImage = hasCustomVideo && !isYouTube && isImageMediaUrl(cat.videoUrl);

          col.innerHTML = `
            <div class="col-skew-frame">
              <div class="col-unskew-media">
                <div class="diag-media-layer" style="opacity: ${restingOpacity};">
                  <canvas class="diag-sim-canvas ${hasCustomVideo ? 'hidden' : ''}"></canvas>
                  <video
                    class="diag-video ${(hasCustomVideo && !isYouTube && !isImage) ? '' : 'hidden'}"
                    ${(hasCustomVideo && !isYouTube && !isImage) ? `src="${escapeHtml(cat.videoUrl)}"` : ''}
                    muted
                    loop
                    playsinline
                    preload="metadata"
                    style="object-position: ${cat.posX}% 50%;"
                  ></video>
                  <img
                    class="diag-video diag-image ${isImage ? '' : 'hidden'}"
                    ${isImage ? `src="${escapeHtml(cat.videoUrl)}"` : ''}
                    alt=""
                    draggable="false"
                    decoding="async"
                    style="object-position: ${cat.posX}% 50%;"
                  >
                  <div class="yt-cover-wrap diag-yt-wrap ${isYouTube ? '' : 'hidden'}">
                    <iframe
                      class="yt-cover-iframe diag-yt-iframe"
                      ${isYouTube ? `src="${buildYouTubeEmbedUrl(ytId, false)}"` : ''}
                      referrerpolicy="strict-origin-when-cross-origin"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                      allowfullscreen
                      style="left: ${100 - cat.posX}%; top: 50%;"
                    ></iframe>
                  </div>
                </div>
              </div>
            </div>

            <div class="diag-title-wrap">
              <h2 class="diag-title select-none">${escapeHtml(cat.title)}</h2>
            </div>

            <div class="editor-overlay-card absolute inset-x-0 bottom-10 flex flex-col items-center justify-center gap-2.5 px-6 z-40">
              <button
                type="button"
                onclick="event.stopPropagation(); openCategoryEditModal('${cat.id}')"
                class="w-14 h-14 rounded-full bg-[#b6ab9d] text-[#151515] border-4 border-[#151515] flex items-center justify-center text-3xl font-bold shadow-2xl hover:scale-110 active:scale-95 transition-transform"
                title="Ajouter ou remplacer la vidéo de ${escapeHtml(cat.title)}"
              >
                +
              </button>

              <div
                onclick="event.stopPropagation()"
                onpointerdown="event.stopPropagation()"
                class="w-56 max-w-[85%] rounded-2xl bg-[#151515]/95 border border-[#b6ab9d]/40 px-3.5 py-2.5 text-[#b6ab9d] shadow-xl backdrop-blur-md"
              >
                <div class="flex items-center justify-between text-[11px] font-semibold mb-1.5">
                  <span>↔ Cadrer la vidéo</span>
                  <span class="pos-x-readout font-mono text-xs" data-cat-id="${cat.id}">${Math.round(cat.posX)}%</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value="${cat.posX}"
                  data-cat-id="${cat.id}"
                  class="colveur-slider pos-x-slider"
                  oninput="updateCategoryPosX('${cat.id}', this.value)"
                />
                <p class="text-[10px] text-center opacity-65 mt-1">
                  Ou glisse l'image de gauche à droite
                </p>
              </div>
            </div>
          `;

          const mediaLayer = col.querySelector('.diag-media-layer');
          const videoEl = col.querySelector('video');
          const imageEl = col.querySelector('.diag-image');
          const ytWrapEl = col.querySelector('.diag-yt-wrap');
          const ytIframeEl = col.querySelector('.diag-yt-iframe');
          const simCanvas = col.querySelector('.diag-sim-canvas');

          registerSimCanvas(simCanvas, cat.theme, cat.id);
          const simEntry = simCanvases[simCanvases.length - 1];

          drawProceduralCinemaFrame(simEntry, 0);

          videoEl.addEventListener('error', () => {
            if (!extractYouTubeId(cat.videoUrl) && !isImageMediaUrl(cat.videoUrl)) {
              videoEl.classList.add('hidden');
              simCanvas.classList.remove('hidden');
            }
          });

          // Photo introuvable ou illisible : on revient à l'animation par défaut
          imageEl.addEventListener('error', () => {
            if (imageEl.getAttribute('src')) {
              imageEl.classList.add('hidden');
              simCanvas.classList.remove('hidden');
            }
          });

          col.addEventListener('mouseenter', () => {
            col.classList.add('is-hovered');
            track.classList.add('has-hovered');
            mediaLayer.style.opacity = '1';
            simEntry.isPlaying = true;

            if (ytWrapEl && !ytWrapEl.classList.contains('hidden') && ytIframeEl) {
              sendYouTubeCommand(ytIframeEl, 'mute');
              sendYouTubeCommand(ytIframeEl, 'playVideo');
            } else if (!videoEl.classList.contains('hidden') && videoEl.src) {
              const p = videoEl.play();
              if (p !== undefined) p.catch(() => {});
            }
          });

          col.addEventListener('mouseleave', () => {
            col.classList.remove('is-hovered');
            if (!track.querySelector('.diag-column.is-hovered')) {
              track.classList.remove('has-hovered');
            }
            mediaLayer.style.opacity = String(restingOpacity);
            simEntry.isPlaying = false;

            if (ytWrapEl && !ytWrapEl.classList.contains('hidden') && ytIframeEl) {
              sendYouTubeCommand(ytIframeEl, 'pauseVideo');
            } else if (!videoEl.classList.contains('hidden')) {
              videoEl.pause();
            }
          });

          col.addEventListener('click', () => {
            if (dragDistance > 6) return;
            openCategoryPage(cat.id);
          });

          track.appendChild(col);
        });
      }

      const singleSetWidth = categories.length * baseColWidth;
      scrollTarget = singleSetWidth * 2;
      scrollCurrent = scrollTarget;
    }

    function nudgeCarousel(direction) {
      scrollTarget += direction * baseColWidth;
    }

    let lastLoopTime = performance.now();

    function animateCarouselLoop(now) {
      const dt = Math.min(0.05, (now - lastLoopTime) / 1000);
      lastLoopTime = now;

      scrollCurrent += (scrollTarget - scrollCurrent) * 0.12;
      if (Math.abs(scrollTarget - scrollCurrent) < 0.15) {
        scrollCurrent = Math.round(scrollTarget);
      }

      const singleSetWidth = categories.length * baseColWidth;
      if (singleSetWidth > 0) {
        const minBound = singleSetWidth * 1;
        const maxBound = singleSetWidth * 3;

        if (scrollCurrent < minBound) {
          scrollCurrent += singleSetWidth;
          scrollTarget += singleSetWidth;
        } else if (scrollCurrent >= maxBound) {
          scrollCurrent -= singleSetWidth;
          scrollTarget -= singleSetWidth;
        }
      }

      track.style.transform = `translate3d(${-scrollCurrent}px, 0, 0)`;

      for (let i = 0; i < simCanvases.length; i++) {
        if (simCanvases[i].isPlaying) {
          drawProceduralCinemaFrame(simCanvases[i], dt);
        }
      }

      if (activeCategoryPageId) {
        for (let i = 0; i < pageVideoSimCanvases.length; i++) {
          drawProceduralCinemaFrame(pageVideoSimCanvases[i], dt);
        }
      }

      requestAnimationFrame(animateCarouselLoop);
    }

    function handleWheelScroll(e) {
      if (introController.phase !== 'DONE') return;
      const catPage = document.getElementById('category-page');
      if (catPage.classList.contains('is-open')) return;
      if (document.querySelector('[id^="modal-"]:not(.hidden)')) return;

      e.preventDefault();
      let rawDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (e.deltaMode === 1) rawDelta *= 36;
      if (e.deltaMode === 2) rawDelta *= 300;

      scrollTarget += rawDelta * 1.35;
    }

    viewport.addEventListener('wheel', handleWheelScroll, { passive: false });

    window.addEventListener('pointerdown', (e) => {
      if (introController.phase !== 'DONE') return;
      if (document.getElementById('category-page').classList.contains('is-open')) return;
      if (e.target.closest('button, input, select, label, #editor-topbar, [id^="modal-"]')) return;

      isPointerDown = true;
      pointerStartX = e.clientX;
      scrollStartTarget = scrollTarget;
      dragDistance = 0;
      viewport.classList.add('is-dragging');

      if (isEditorMode) {
        const col = e.target.closest('.diag-column');
        if (col && col.dataset.catId) {
          framingDragCatId = col.dataset.catId;
          const cat = categories.find(c => c.id === framingDragCatId);
          framingStartPosX = cat ? cat.posX : 50;
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - pointerStartX;
      dragDistance = Math.abs(dx);

      if (isEditorMode && framingDragCatId) {
        const sensitivity = 0.18;
        const newPosX = Math.max(0, Math.min(100, framingStartPosX - dx * sensitivity));
        updateCategoryPosX(framingDragCatId, newPosX);
      } else {
        scrollTarget = scrollStartTarget - dx * 1.3;
      }
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
      framingDragCatId = null;
      viewport.classList.remove('is-dragging');
    });

    window.addEventListener('resize', () => {
      updateColumnDimensions();
    });

    /*************************************************************************
     * 4B. RECADRAGE VIDÉO GAUCHE <-> DROITE & MODIFICATIONS EN DIRECT
     *************************************************************************/
    function updateCategoryPosX(catId, newValue) {
      const clamped = Math.max(0, Math.min(100, parseFloat(newValue) || 50));
      const cat = categories.find(c => c.id === catId);
      if (cat) {
        cat.posX = clamped;
        saveCategoriesToStorage();
      }

      document.querySelectorAll(`.diag-column[data-cat-id="${catId}"] .diag-video`).forEach(vid => {
        vid.style.objectPosition = `${clamped}% 50%`;
      });
      document.querySelectorAll(`.diag-column[data-cat-id="${catId}"] .diag-yt-iframe`).forEach(ifr => {
        ifr.style.left = `${100 - clamped}%`;
      });

      simCanvases.forEach(item => {
        if (item.catId === catId) {
          drawProceduralCinemaFrame(item, 0);
        }
      });

      document.querySelectorAll(`.pos-x-slider[data-cat-id="${catId}"]`).forEach(slider => {
        slider.value = clamped;
      });

      document.querySelectorAll(`.pos-x-readout[data-cat-id="${catId}"]`).forEach(label => {
        label.textContent = `${Math.round(clamped)}%`;
      });

      const modalSlider = document.getElementById('modal-pos-x-slider');
      const modalLabel = document.getElementById('modal-pos-x-label');
      if (activeEditCatId === catId && modalSlider && modalLabel) {
        modalSlider.value = clamped;
        modalLabel.textContent = `${Math.round(clamped)}%`;
      }
    }

    function updateCategoryPosXFromModal(val) {
      if (!activeEditCatId) return;
      updateCategoryPosX(activeEditCatId, val);
    }

    function updateRestingOpacity(valPercent) {
      restingOpacity = Math.max(0.1, Math.min(0.95, parseInt(valPercent, 10) / 100));
      document.getElementById('resting-opacity-label').textContent = `${valPercent}%`;

      document.querySelectorAll('.diag-column:not(.is-hovered) .diag-media-layer').forEach(layer => {
        layer.style.opacity = String(restingOpacity);
      });
    }

    function changeHoverMode(mode) {
      document.body.setAttribute('data-hover-mode', mode);
    }

    /*************************************************************************
     * 5. PAGE DE DESTINATION : PAGES PLEIN ÉCRAN ALTERNÉES (TAUPE / NOIR)
     *************************************************************************/
    const categoryPage = document.getElementById('category-page');
    const categoryScrollContainer = document.getElementById('category-scroll-container');
    const categoryPagesList = document.getElementById('category-pages-list');
    const categoryEditorFooter = document.getElementById('category-editor-footer');
    const clipTaupeHeader = document.getElementById('clip-taupe-header');
    const clipNoirHeader = document.getElementById('clip-noir-header');
    let splitHeaderRafId = null;
    let headerAutoHideTimer = null;
    let isHoveringBackButton = false;
    const HEADER_AUTO_HIDE_DELAY = 2200;

    function revealCategoryHeaderOnAction() {
      if (!categoryPage.classList.contains('is-open')) return;

      categoryPage.classList.add('header-visible');

      if (headerAutoHideTimer) {
        clearTimeout(headerAutoHideTimer);
      }

      headerAutoHideTimer = setTimeout(() => {
        if (!isHoveringBackButton && categoryPage.classList.contains('is-open')) {
          categoryPage.classList.remove('header-visible');
        }
      }, HEADER_AUTO_HIDE_DELAY);
    }

    function setBackButtonHover(isHover) {
      isHoveringBackButton = isHover;
      document.querySelectorAll('.cat-back-pill').forEach(btn => {
        btn.classList.toggle('is-hovered', isHover);
      });
      if (isHover) {
        if (headerAutoHideTimer) clearTimeout(headerAutoHideTimer);
        categoryPage.classList.add('header-visible');
      } else {
        revealCategoryHeaderOnAction();
      }
    }

    categoryPage.addEventListener('pointermove', () => {
      revealCategoryHeaderOnAction();
    }, { passive: true });

    categoryPage.addEventListener('wheel', () => {
      revealCategoryHeaderOnAction();
    }, { passive: true });

    categoryPage.addEventListener('touchstart', () => {
      revealCategoryHeaderOnAction();
    }, { passive: true });

    function applyCategoryScrollModeUI() {
      if (!categoryScrollContainer) return;
      categoryScrollContainer.classList.toggle('scroll-mode-snap', categoryScrollMode === 'snap');
      const selectEl = document.getElementById('category-scroll-mode-select');
      if (selectEl) {
        selectEl.value = categoryScrollMode;
      }
    }

    function changeCategoryScrollMode(newMode) {
      categoryScrollMode = newMode === 'snap' ? 'snap' : 'free';
      try {
        localStorage.setItem(STORAGE_KEY_SCROLL_MODE, categoryScrollMode);
      } catch (e) {}
      applyCategoryScrollModeUI();
      updateCategorySplitHeader();
    }

    function syncEditorTopbarContext() {
      const homeCtrls = document.getElementById('editor-home-controls');
      const catCtrls = document.getElementById('editor-category-controls');
      if (!homeCtrls || !catCtrls) return;

      if (activeCategoryPageId) {
        homeCtrls.classList.add('hidden');
        homeCtrls.classList.remove('flex');
        catCtrls.classList.remove('hidden');
        catCtrls.classList.add('flex');
      } else {
        catCtrls.classList.add('hidden');
        catCtrls.classList.remove('flex');
        homeCtrls.classList.remove('hidden');
        homeCtrls.classList.add('flex');
      }
    }

    function updateCategorySplitHeader() {
      if (!categoryPage.classList.contains('is-open')) return;

      const headerHeight = 132;
      const vw = window.innerWidth;
      const sections = categoryPagesList.querySelectorAll('.cat-page-section');

      let taupeRectsHtml = '';
      let noirRectsHtml = '';

      sections.forEach((sec) => {
        const rect = sec.getBoundingClientRect();
        const top = Math.max(0, rect.top);
        const bottom = Math.min(headerHeight, rect.bottom);

        if (bottom > top) {
          const rectTag = `<rect x="0" y="${top.toFixed(2)}" width="${vw}" height="${(bottom - top).toFixed(2)}" />`;
          if (sec.dataset.bgTheme === 'taupe') {
            taupeRectsHtml += rectTag;
          } else {
            noirRectsHtml += rectTag;
          }
        }
      });

      if (isEditorMode && categoryEditorFooter) {
        const fRect = categoryEditorFooter.getBoundingClientRect();
        const fTop = Math.max(0, fRect.top);
        const fBottom = Math.min(headerHeight, fRect.bottom);
        if (fBottom > fTop) {
          const rectTag = `<rect x="0" y="${fTop.toFixed(2)}" width="${vw}" height="${(fBottom - fTop).toFixed(2)}" />`;
          if (categoryEditorFooter.dataset.bgTheme === 'taupe') {
            taupeRectsHtml += rectTag;
          } else {
            noirRectsHtml += rectTag;
          }
        }
      }

      clipTaupeHeader.innerHTML = taupeRectsHtml;
      clipNoirHeader.innerHTML = noirRectsHtml;
    }

    function syncCategoryFullscreenVideosPlayback() {
      const sections = categoryPagesList.querySelectorAll('.cat-page-section');
      if (!categoryPage.classList.contains('is-open')) {
        sections.forEach(sec => {
          sec.querySelectorAll('video').forEach(vid => vid.pause());
          sec.querySelectorAll('iframe.yt-cover-iframe').forEach(ifr => sendYouTubeCommand(ifr, 'pauseVideo'));
        });
        return;
      }

      const vh = window.innerHeight || 1;
      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        const visibleHeight = Math.min(vh, rect.bottom) - Math.max(0, rect.top);
        const visibleRatio = visibleHeight / vh;
        const pageId = sec.dataset.pageId;
        const cat = categories.find(c => c.id === activeCategoryPageId);
        const pageObj = cat && cat.pages ? cat.pages.find(p => p.id === pageId) : null;

        const vid = sec.querySelector('.cat-page-fullscreen-video');
        if (vid && !vid.classList.contains('hidden') && vid.getAttribute('src')) {
          if (visibleRatio > 0.35) {
            if (pageObj) {
              vid.volume = Math.max(0, Math.min(1, (typeof pageObj.videoVolume === 'number' ? pageObj.videoVolume : 80) / 100));
              vid.muted = Boolean(pageObj.videoMuted);
            }
            if (vid.paused) {
              const p = vid.play();
              if (p !== undefined) {
                p.catch(() => {
                  vid.muted = true;
                  vid.play().catch(() => {});
                });
              }
            }
          } else {
            if (!vid.paused) vid.pause();
          }
        }

        const ytFullIframe = sec.querySelector('.cat-page-yt-iframe');
        if (ytFullIframe && ytFullIframe.getAttribute('src')) {
          if (visibleRatio > 0.35) {
            sendYouTubeCommand(ytFullIframe, 'playVideo');
            if (pageObj) {
              const vol = Math.round(typeof pageObj.videoVolume === 'number' ? pageObj.videoVolume : 80);
              sendYouTubeCommand(ytFullIframe, 'setVolume', [vol]);
              sendYouTubeCommand(ytFullIframe, pageObj.videoMuted ? 'mute' : 'unMute');
            }
          } else {
            sendYouTubeCommand(ytFullIframe, 'pauseVideo');
          }
        }

        sec.querySelectorAll('.m2-video-el').forEach(m2Vid => {
          if (!m2Vid.getAttribute('src')) return;
          if (visibleRatio > 0.3) {
            if (m2Vid.paused && m2Vid.dataset.userPaused !== 'true') {
              const p = m2Vid.play();
              if (p !== undefined) p.catch(() => {});
            }
          } else {
            if (!m2Vid.paused) m2Vid.pause();
          }
        });

        sec.querySelectorAll('.m2-yt-iframe').forEach(m2Yt => {
          if (!m2Yt.getAttribute('src')) return;
          if (visibleRatio > 0.3) {
            if (m2Yt.dataset.userPaused !== 'true') {
              sendYouTubeCommand(m2Yt, 'playVideo');
            }
          } else {
            sendYouTubeCommand(m2Yt, 'pauseVideo');
          }
        });
      });
    }

    function startSplitHeaderLoop() {
      if (splitHeaderRafId) cancelAnimationFrame(splitHeaderRafId);
      function tick() {
        if (!categoryPage.classList.contains('is-open')) {
          splitHeaderRafId = null;
          return;
        }
        updateCategorySplitHeader();
        splitHeaderRafId = requestAnimationFrame(tick);
      }
      splitHeaderRafId = requestAnimationFrame(tick);
    }

    categoryScrollContainer.addEventListener('scroll', () => {
      updateCategorySplitHeader();
      revealCategoryHeaderOnAction();
      syncCategoryFullscreenVideosPlayback();
    }, { passive: true });
    window.addEventListener('resize', updateCategorySplitHeader);

    function renderCategoryPages(cat) {
      if (!cat.pages || cat.pages.length === 0) {
        cat.pages = createDefaultPages();
      }

      cat.pages = cat.pages.map((p, idx) => normalizePageObject(p, idx));
      categoryPagesList.innerHTML = '';
      pageVideoSimCanvases.length = 0;

      cat.pages.forEach((page, index) => {
        const isVideoTemplate = page.template === 'fullscreen-video';

        const pageYtId = extractYouTubeId(page.videoUrl);
        const isPageYouTube = Boolean(pageYtId);

        section.innerHTML = `
          ${isVideoTemplate ? `
            <div

              <video

              ${isPageYouTube ? `

          ${m2BlocksHtml}

          <div class="cat-page-editor-bar ${isEditorMode ? 'flex' : 'hidden'} absolute top-24 left-6 right-6 z-40 items-center justify-between flex-wrap gap-2 pointer-events-auto">
            <div class="flex items-center flex-wrap gap-2">
              <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full ${isTaupe ? 'bg-[#151515] text-[#b6ab9d]' : 'bg-[#b6ab9d] text-[#151515]'} text-xs font-semibold shadow-md">
                <span class="font-dela">Page ${index + 1}</span>
              </div>

              <select
                onchange="changePageTemplate('${page.id}', this.value)"
                class="px-3 py-1.5 rounded-full bg-[#151515]/95 text-[#b6ab9d] border border-[#b6ab9d]/40 text-xs font-semibold shadow-md cursor-pointer focus:outline-none"
                title="Choisir le modèle de cette page"

                <option value="blank" ${page.template === 'blank' ? 'selected' : ''} class="bg-[#151515] text-[#b6ab9d]">Modèle : Fond uni</option>
                <option value="fullscreen-video" ${isVideoTemplate ? 'selected' : ''} class="bg-[#151515] text-[#b6ab9d]">Modèle 1 : Vidéo Plein Écran</option>

              <button
