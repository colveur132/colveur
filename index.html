                <span>Fond : ${isTaupe ? 'Taupe' : 'Noir'} (Switcher)</span>
              </button>

              ${(isMediaTextTemplate || isBlankTemplate) ? `
                <button
                  type="button"
                  onclick="addM2BlockToPage('${page.id}', 'video')"
                  class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#b6ab9d] text-[#151515] border border-[#151515] text-xs font-bold shadow-md hover:scale-105 transition-transform"
                  title="Ajouter un cadre vidéo sur cette page"
                >
                  <span>+ Cadre vidéo</span>
                </button>
                <button
                  type="button"
                  onclick="addM2BlockToPage('${page.id}', 'text')"
                  class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#b6ab9d] text-[#151515] border border-[#151515] text-xs font-bold shadow-md hover:scale-105 transition-transform"
                  title="Ajouter une zone de texte sur cette page"
                >
                  <span>+ Zone de texte</span>
                </button>
                <button
                  type="button"
                  onclick="addM2BlockToPage('${page.id}', 'image')"
                  class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#b6ab9d] text-[#151515] border border-[#151515] text-xs font-bold shadow-md hover:scale-105 transition-transform"
                  title="Ajouter une image (PNG transparent, JPG...) sur cette page"
                >
                  <span>+ Image</span>
                </button>
                <button
                  type="button"
                  onclick="addM2BlockToPage('${page.id}', 'embed')"
                  class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#b6ab9d] text-[#151515] border border-[#151515] text-xs font-bold shadow-md hover:scale-105 transition-transform"
                  title="Ajouter une petite fenêtre qui affiche ton TikTok, une vidéo ou un site"
                >
                  <span>+ Fenêtre web</span>
                </button>
              ` : ''}
            </div>

            <div class="flex items-center gap-1.5">
              <button
                type="button"
                onclick="moveCategoryPage('${page.id}', -1)"
                ${index === 0 ? 'disabled' : ''}
                class="w-8 h-8 rounded-full ${isTaupe ? 'bg-[#151515] text-[#b6ab9d]' : 'bg-[#b6ab9d] text-[#151515]'} flex items-center justify-center text-xs font-bold shadow disabled:opacity-25 hover:scale-105 transition-transform"
                title="Monter cette page"
              >
                ↑
              </button>
              <button
                type="button"
                onclick="moveCategoryPage('${page.id}', 1)"
                ${index === cat.pages.length - 1 ? 'disabled' : ''}
                class="w-8 h-8 rounded-full ${isTaupe ? 'bg-[#151515] text-[#b6ab9d]' : 'bg-[#b6ab9d] text-[#151515]'} flex items-center justify-center text-xs font-bold shadow disabled:opacity-25 hover:scale-105 transition-transform"
                title="Descendre cette page"
              >
                ↓
              </button>
              ${cat.pages.length > 1 ? `
                <button
                  type="button"
                  onclick="requestDeleteCategoryPage('${page.id}')"
                  class="px-3 h-8 rounded-full ${isPendingDel ? 'bg-red-600 text-white' : (isTaupe ? 'bg-[#151515] text-red-400' : 'bg-[#b6ab9d] text-red-700')} flex items-center justify-center text-xs font-bold shadow hover:scale-105 transition-all"
                  title="Supprimer cette page"
                >
                  ${isPendingDel ? 'Confirmer ✕' : '✕'}
                </button>
              ` : ''}
            </div>
          </div>

          ${isVideoTemplate ? `
            <div class="cat-page-editor-placeholder ${isEditorMode ? 'flex' : 'hidden'} relative z-20 flex-col items-center justify-center gap-3 p-5 rounded-2xl bg-[#151515]/90 border border-[#b6ab9d]/40 text-[#b6ab9d] shadow-2xl backdrop-blur-md max-w-md w-[90%] pointer-events-auto">
              <div class="flex items-center gap-3 w-full">
                <button
                  type="button"
                  onclick="openPageVideoEditModal('${page.id}')"
                  class="w-12 h-12 shrink-0 rounded-full bg-[#b6ab9d] text-[#151515] flex items-center justify-center text-2xl font-bold shadow-lg hover:scale-105 transition-transform"
                  title="Ajouter ou changer la vidéo plein écran"
                >
                  +
                </button>
                <div class="text-left">
                  <div class="font-dela text-sm">Page ${index + 1} — Vidéo Plein Écran</div>
                  <div class="text-[11px] opacity-75">
                    ${hasCustomVideo ? 'Vidéo personnalisée chargée' : 'Aperçu intégré actif (clique sur + pour charger ta vidéo)'}
                  </div>
                </div>
              </div>

              <div class="w-full pt-2 border-t border-[#b6ab9d]/20">
                <div class="flex items-center justify-between text-xs font-semibold mb-1">
                  <span>Opacité de la vidéo</span>
                  <span class="page-opacity-readout font-mono" data-page-id="${page.id}">${Math.round(opacityPercent)}%</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value="${opacityPercent}"
                  data-page-id="${page.id}"
                  class="colveur-slider page-opacity-slider"
                  oninput="updatePageVideoOpacity('${page.id}', this.value)"
                />
              </div>

              <div class="w-full pt-2 border-t border-[#b6ab9d]/20">
                <div class="flex items-center justify-between text-xs font-semibold mb-1">
                  <span>Volume audio (Boucle)</span>
                  <div class="flex items-center gap-2">
                    <span class="page-volume-readout font-mono" data-page-id="${page.id}">${isMuted ? 'MUET' : Math.round(volumePercent) + '%'}</span>
                    <button
                      type="button"
                      onclick="togglePageVideoMute('${page.id}')"
                      class="page-mute-btn px-2.5 py-0.5 rounded-lg bg-[#252525] border border-[#b6ab9d]/35 text-[11px] font-bold hover:border-[#b6ab9d]"
                      data-page-id="${page.id}"
                    >
                      ${isMuted ? '🔇 Muet' : '🔊 Son ON'}
                    </button>
                  </div>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value="${volumePercent}"
                  data-page-id="${page.id}"
                  class="colveur-slider page-volume-slider"
                  oninput="updatePageVideoVolume('${page.id}', this.value)"
                />
              </div>
            </div>
          ` : (isMediaTextTemplate || hasFreeBlocks) ? '' : `
            <div class="cat-page-editor-placeholder ${isEditorMode ? 'flex' : 'hidden'} relative z-10 flex-col items-center justify-center text-center px-6 opacity-55 pointer-events-none select-none">
              <span class="font-dela text-lg md:text-2xl mb-1">Page ${index + 1} — Page vierge (Fond uni)</span>
              <span class="text-xs uppercase tracking-widest">Plein écran 100% • Fond ${colorName}</span>
            </div>
          `}
        `;

        if (isVideoTemplate) {
          const simCanvas = section.querySelector('.cat-page-sim-canvas');
          const videoEl = section.querySelector('.cat-page-fullscreen-video');

          if (simCanvas) {
            const simItem = {
              canvas: simCanvas,
              ctx: simCanvas.getContext('2d'),
              theme: cat.theme || 'docu',
              catId: cat.id,
              time: index * 3.5,
              isPlaying: true
            };
            pageVideoSimCanvases.push(simItem);
            drawProceduralCinemaFrame(simItem, 0);
          }

          if (videoEl) {
            videoEl.volume = Math.max(0, Math.min(1, volumePercent / 100));
            videoEl.muted = isMuted;
            videoEl.addEventListener('error', () => {
              videoEl.classList.add('hidden');
              if (simCanvas) simCanvas.classList.remove('hidden');
            });
          }
        }

        categoryPagesList.appendChild(section);
      });

      const lastPage = cat.pages[cat.pages.length - 1];
      const nextIsTaupe = lastPage ? (lastPage.bgTheme === 'noir') : (cat.pages.length % 2 === 0);
      const nextColorLabel = nextIsTaupe ? 'Taupe (#b6ab9d)' : 'Noir (#151515)';
      if (categoryEditorFooter) {
        categoryEditorFooter.dataset.bgTheme = nextIsTaupe ? 'taupe' : 'noir';
        categoryEditorFooter.style.backgroundColor = nextIsTaupe ? '#b6ab9d' : '#151515';
        categoryEditorFooter.style.color = nextIsTaupe ? '#151515' : '#b6ab9d';
      }

      const nextHintEl = document.getElementById('next-page-color-hint');
      if (nextHintEl) {
        nextHintEl.textContent = `Prochaine page vierge en fond ${nextColorLabel} (ou Noir automatique pour une Vidéo Plein Écran)`;
      }

      updateCategorySplitHeader();
      syncCategoryFullscreenVideosPlayback();
    }

    function openCategoryPage(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;

      activeCategoryPageId = catId;
      pendingDeletePageId = null;

      document.querySelectorAll('.cat-header-title').forEach(el => {
        el.textContent = cat.title;
      });

      if (headerAutoHideTimer) {
        clearTimeout(headerAutoHideTimer);
        headerAutoHideTimer = null;
      }
      categoryPage.classList.remove('header-visible');

      applyCategoryScrollModeUI();
      renderCategoryPages(cat);

      categoryScrollContainer.scrollTop = 0;
      categoryPage.classList.add('is-open');
      categoryPage.setAttribute('aria-hidden', 'false');

      syncEditorTopbarContext();
      updateCategorySplitHeader();
      startSplitHeaderLoop();
      syncCategoryFullscreenVideosPlayback();
    }

    function closeCategoryPage() {
      if (headerAutoHideTimer) {
        clearTimeout(headerAutoHideTimer);
        headerAutoHideTimer = null;
      }
      categoryPage.classList.remove('header-visible');
      categoryPage.classList.remove('is-open');
      categoryPage.setAttribute('aria-hidden', 'true');

      categoryPagesList.querySelectorAll('video').forEach(vid => {
        vid.pause();
      });
      // Mettre aussi en pause les lecteurs YouTube (les <video> seuls ne suffisent pas)
      categoryPagesList.querySelectorAll('iframe').forEach(ifr => {
        sendYouTubeCommand(ifr, 'pauseVideo');
        sendYouTubeCommand(ifr, 'mute');
      });

      activeCategoryPageId = null;
      pendingDeletePageId = null;
      setBackButtonHover(false);
      syncEditorTopbarContext();

      // Arrêt définitif une fois la page catégorie invisible (après sa transition de 0,45 s) :
      // on décharge les lecteurs, aucun son ne peut continuer. La page est reconstruite à la prochaine ouverture.
      const closeToken = ++categoryCloseToken;
      setTimeout(() => {
        if (closeToken !== categoryCloseToken || activeCategoryPageId) return;
        categoryPagesList.querySelectorAll('iframe').forEach(ifr => {
          ifr.removeAttribute('srcdoc');
          ifr.removeAttribute('src');
        });
        categoryPagesList.querySelectorAll('video').forEach(vid => {
          vid.pause();
          vid.removeAttribute('src');
          vid.load();
        });
      }, 600);
    }

    let categoryCloseToken = 0;

    function openAddPageTemplateModal() {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const nextIndex = cat.pages.length;
      const nextIsTaupe = nextIndex % 2 === 0;
      const nextColorHex = nextIsTaupe ? '#b6ab9d' : '#151515';
      const nextTextHex = nextIsTaupe ? '#151515' : '#b6ab9d';
      const nextColorName = nextIsTaupe ? 'Taupe (#b6ab9d)' : 'Noir (#151515)';

      const previewBox = document.getElementById('template-blank-preview');
      if (previewBox) {
        previewBox.style.backgroundColor = nextColorHex;
        previewBox.innerHTML = `<span class="font-dela text-xs" style="color: ${nextTextHex}; opacity: 0.85;">Page ${nextIndex + 1}</span>`;
      }

      const infoEl = document.getElementById('modal-template-color-info');
      if (infoEl) {
        infoEl.innerHTML = `Cette nouvelle page (<strong>Page ${nextIndex + 1}</strong>) sera ajoutée en plein écran (100%) avec un fond <strong>${nextColorName}</strong>.`;
      }

      openModal('modal-add-page-template');
    }

    function addPageToActiveCategory(templateType) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const isVideoTpl = templateType === 'fullscreen-video';
      const isM2Tpl = templateType === 'media-text';
      const lastPage = cat.pages[cat.pages.length - 1];
      const nextAlternatedTheme = lastPage ? (lastPage.bgTheme === 'noir' ? 'taupe' : 'noir') : (cat.pages.length % 2 === 0 ? 'taupe' : 'noir');

      const newPage = normalizePageObject({
        id: 'page-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        template: isVideoTpl ? 'fullscreen-video' : (isM2Tpl ? 'media-text' : 'blank'),
        bgTheme: isVideoTpl ? 'noir' : nextAlternatedTheme,
        videoOpacity: 80,
        videoVolume: 80,
        videoMuted: false,
        blocks: createDefaultM2Blocks()
      }, cat.pages.length);

      cat.pages.push(newPage);
      saveCategoriesToStorage();
      closeModal('modal-add-page-template');
      renderCategoryPages(cat);

      const addedEl = categoryPagesList.querySelector(`.cat-page-section[data-page-id="${newPage.id}"]`);
      if (addedEl) {
        addedEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function changePageTemplate(pageId, newTemplate) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const page = cat.pages.find(p => p.id === pageId);
      if (!page) return;

      if (newTemplate === 'fullscreen-video') {
        page.template = 'fullscreen-video';
        page.title = 'Modèle 1 : Vidéo Plein Écran';
        page.bgTheme = 'noir';
      } else if (newTemplate === 'media-text') {
        page.template = 'media-text';
        page.title = 'Modèle 2 : Cadre Vidéo & Texte';
        if (!Array.isArray(page.blocks) || page.blocks.length === 0) {
          page.blocks = createDefaultM2Blocks();
        }
      } else {
        page.template = 'blank';
        page.title = 'Page vierge (Fond uni)';
      }

      saveCategoriesToStorage();
      renderCategoryPages(cat);
    }

    function togglePageBackgroundColor(pageId) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const page = cat.pages.find(p => p.id === pageId);
      if (!page) return;

      page.bgTheme = page.bgTheme === 'taupe' ? 'noir' : 'taupe';
      saveCategoriesToStorage();
      renderCategoryPages(cat);
    }

    function updatePageVideoOpacity(pageId, valPercent) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const page = cat.pages.find(p => p.id === pageId);
      const clamped = Math.max(0, Math.min(100, parseFloat(valPercent) || 0));
      if (page) {
        page.videoOpacity = clamped;
        saveCategoriesToStorage();
      }

      const sec = categoryPagesList.querySelector(`.cat-page-section[data-page-id="${pageId}"]`);
      if (sec) {
        const layer = sec.querySelector('.cat-page-video-layer');
        if (layer) layer.style.opacity = (clamped / 100).toFixed(2);
      }

      document.querySelectorAll(`.page-opacity-readout[data-page-id="${pageId}"]`).forEach(el => {
        el.textContent = `${Math.round(clamped)}%`;
      });
      document.querySelectorAll(`.page-opacity-slider[data-page-id="${pageId}"]`).forEach(el => {
        el.value = clamped;
      });

      if (activeEditPageId === pageId) {
        const mLabel = document.getElementById('modal-page-opacity-label');
        const mSlider = document.getElementById('modal-page-opacity-slider');
        if (mLabel) mLabel.textContent = `${Math.round(clamped)}%`;
        if (mSlider) mSlider.value = clamped;
      }
    }

    function updatePageVideoVolume(pageId, valPercent) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const page = cat.pages.find(p => p.id === pageId);
      const clamped = Math.max(0, Math.min(100, parseFloat(valPercent) || 0));
      if (page) {
        page.videoVolume = clamped;
        if (clamped > 0 && page.videoMuted) {
          page.videoMuted = false;
        }
        saveCategoriesToStorage();
      }

      const sec = categoryPagesList.querySelector(`.cat-page-section[data-page-id="${pageId}"]`);
      if (sec) {
        const vid = sec.querySelector('.cat-page-fullscreen-video');
        if (vid) {
          vid.volume = clamped / 100;
          vid.muted = page ? Boolean(page.videoMuted) : false;
        }
        const ytIframe = sec.querySelector('.cat-page-yt-iframe');
        if (ytIframe) {
          sendYouTubeCommand(ytIframe, 'setVolume', [Math.round(clamped)]);
          sendYouTubeCommand(ytIframe, (page && page.videoMuted) ? 'mute' : 'unMute');
        }
      }

      refreshPageAudioUI(pageId);
    }

    function togglePageVideoMute(pageId) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const page = cat.pages.find(p => p.id === pageId);
      if (!page) return;

      page.videoMuted = !page.videoMuted;
      saveCategoriesToStorage();

    function moveCategoryPage(pageId, direction) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat) return;

      const idx = cat.pages.findIndex(p => p.id === pageId);
      const targetIdx = idx + direction;
      if (idx < 0 || targetIdx < 0 || targetIdx >= cat.pages.length) return;

      const temp = cat.pages[idx];
      cat.pages[idx] = cat.pages[targetIdx];
      cat.pages[targetIdx] = temp;

      saveCategoriesToStorage();
      renderCategoryPages(cat);
    }

    function requestDeleteCategoryPage(pageId) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat || cat.pages.length <= 1) return;

      if (pendingDeletePageId === pageId) {
        if (pendingDeleteTimeout) clearTimeout(pendingDeleteTimeout);
        pendingDeletePageId = null;
        cat.pages = cat.pages.filter(p => p.id !== pageId);
        saveCategoriesToStorage();
        renderCategoryPages(cat);
      } else {
        pendingDeletePageId = pageId;
        renderCategoryPages(cat);
        if (pendingDeleteTimeout) clearTimeout(pendingDeleteTimeout);
        pendingDeleteTimeout = setTimeout(() => {
          pendingDeletePageId = null;
          if (activeCategoryPageId === cat.id) {
            renderCategoryPages(cat);
          }
        }, 3000);
      }
    }

    /*************************************************************************
     * 5B. LOGIQUE DU MODÈLE 2 : DÉPLACEMENT, REDIMENSIONNEMENT, VIDÉO & TEXTE
     *************************************************************************/
    let m2DragState = null;

    function findActivePageAndBlock(pageId, blockId) {
      if (!activeCategoryPageId) return { cat: null, page: null, block: null };
      const cat = categories.find(c => c.id === activeCategoryPageId);
      if (!cat || !Array.isArray(cat.pages)) return { cat: null, page: null, block: null };
      const page = cat.pages.find(p => p.id === pageId);
      if (!page) return { cat, page: null, block: null };
      const block = getPageBlockList(page).find(b => b.id === blockId);
      return { cat, page, block };
    }

    /** Liste des blocs de la page : blocs libres pour « Fond uni », cadres du Modèle 2 sinon */
    function getPageBlockList(page) {
      if (page.template === 'blank') {
        if (!Array.isArray(page.freeBlocks)) page.freeBlocks = [];
        return page.freeBlocks;
      }
      if (!Array.isArray(page.blocks) || page.blocks.length === 0) page.blocks = createDefaultM2Blocks();
      return page.blocks;
    }

    function handleM2StagePointerDown(e, pageId) {
      if (!isEditorMode) return;
      if (e.target.classList.contains('m2-canvas-stage')) {
        selectedM2BlockId = null;
        document.querySelectorAll('.m2-block.is-selected').forEach(el => el.classList.remove('is-selected'));
      }
    }

    function selectM2Block(pageId, blockId) {
      if (!isEditorMode) return;
      selectedM2BlockId = blockId;
      document.querySelectorAll('.m2-block').forEach(el => {
        el.classList.toggle('is-selected', el.dataset.blockId === blockId);
      });
    }

    function startM2BlockInteract(e, pageId, blockId, mode) {
      if (!isEditorMode) return;
      if (mode === 'move' && e.target.closest('.m2-text-content') && document.activeElement === e.target.closest('.m2-text-content')) {
        selectM2Block(pageId, blockId);
        return;
      }
      if (e.target.closest('button, input, select, .m2-player-controls')) return;

      e.stopPropagation();
      if (mode !== 'move') e.preventDefault();

      selectM2Block(pageId, blockId);

      const { page, block } = findActivePageAndBlock(pageId, blockId);
      if (!page || !block) return;

      const blockEl = document.querySelector(`.m2-block[data-page-id="${pageId}"][data-block-id="${blockId}"]`);
      const stageEl = blockEl ? blockEl.closest('.m2-canvas-stage') : null;
      if (!blockEl || !stageEl) return;

      const stageRect = stageEl.getBoundingClientRect();

      m2DragState = {
        pageId,
        blockId,
        mode,
        startX: e.clientX,
        startY: e.clientY,
        stageWidth: Math.max(1, stageRect.width),
        stageHeight: Math.max(1, stageRect.height),
        origX: block.x,
        origY: block.y,
        origW: block.w,
        origH: block.h,
        blockEl,
        stageEl
      };
    }

    window.addEventListener('pointermove', (e) => {
      if (!m2DragState) return;
      const { pageId, blockId, mode, startX, startY, stageWidth, stageHeight, origX, origY, origW, origH, blockEl, stageEl } = m2DragState;
      const { block } = findActivePageAndBlock(pageId, blockId);
      if (!block) return;

      const dxPct = ((e.clientX - startX) / stageWidth) * 100;
      const dyPct = ((e.clientY - startY) / stageHeight) * 100;

      const guideV = stageEl.querySelector('.guide-v');
      const guideH = stageEl.querySelector('.guide-h');
      let showV = false;
      let showH = false;

      if (mode === 'move') {
        let nextX = Math.max(0, Math.min(100 - origW, origX + dxPct));
        let nextY = Math.max(0, Math.min(100 - origH, origY + dyPct));

        const centerX = nextX + origW / 2;
        const centerY = nextY + origH / 2;
        if (Math.abs(centerX - 50) < 1.2) {
          nextX = 50 - origW / 2;
          showV = true;
        }
        if (Math.abs(centerY - 50) < 1.2) {
          nextY = 50 - origH / 2;
          showH = true;
        }

        block.x = Number(nextX.toFixed(2));
        block.y = Number(nextY.toFixed(2));
      } else {
        const minW = block.type === 'text' ? 12 : 10;
        const minH = block.type === 'text' ? 8 : 10;

        let nx = origX;
        let ny = origY;
        let nw = origW;
        let nh = origH;

        if (mode.includes('e')) {
          nw = Math.max(minW, Math.min(100 - origX, origW + dxPct));
        }
        if (mode.includes('s')) {
          nh = Math.max(minH, Math.min(100 - origY, origH + dyPct));
        }
        if (mode.includes('w')) {
          const maxDeltaX = origW - minW;
          const clampedDx = Math.max(-origX, Math.min(maxDeltaX, dxPct));
          nx = origX + clampedDx;
          nw = origW - clampedDx;
        }
        if (mode.includes('n')) {
          const maxDeltaY = origH - minH;
          const clampedDy = Math.max(-origY, Math.min(maxDeltaY, dyPct));
          ny = origY + clampedDy;
          nh = origH - clampedDy;
        }

        block.x = Number(nx.toFixed(2));
        block.y = Number(ny.toFixed(2));
        block.w = Number(nw.toFixed(2));
        block.h = Number(nh.toFixed(2));
      }

      blockEl.style.left = `${block.x}%`;
      blockEl.style.top = `${block.y}%`;
      blockEl.style.width = `${block.w}%`;
      blockEl.style.height = `${block.h}%`;
      blockEl.classList.toggle('toolbar-below', block.y < 18);

      if (guideV) guideV.classList.toggle('is-visible', showV);
      if (guideH) guideH.classList.toggle('is-visible', showH);
    });

    window.addEventListener('pointerup', () => {
      if (!m2DragState) return;
      const { stageEl } = m2DragState;
      if (stageEl) {
        stageEl.querySelectorAll('.m2-guide-line').forEach(g => g.classList.remove('is-visible'));
      }
      m2DragState = null;
      saveCategoriesToStorage();
    });

    function addM2BlockToPage(pageId, blockType) {
      if (!activeCategoryPageId) return;
      const cat = categories.find(c => c.id === activeCategoryPageId);
      const page = cat && cat.pages ? cat.pages.find(p => p.id === pageId) : null;
      if (!page) return;

      const list = getPageBlockList(page);
      const offset = (list.length % 4) * 3.5;
      const vw = window.innerWidth || 1920;
      const vh = window.innerHeight || 1080;
      let newBlock;
      if (blockType === 'image') {
        newBlock = normalizeM2Block({
          id: 'blk-img-' + Date.now(),
          type: 'image',
          x: Math.min(62, 40 + offset),
          y: Math.min(56, 30 + offset),
          w: 20,
          h: 34
        }, 0);
      } else if (blockType === 'embed') {
        // Format vertical façon TikTok, assez large pour son intégration (288 px minimum)
        const h = 72;
        const w = Math.min(45, Math.max((300 / vw) * 100, ((h / 100) * vh * (9 / 16) / vw) * 100));
        newBlock = normalizeM2Block({
          id: 'blk-web-' + Date.now(),
          type: 'embed',
          x: Math.max(2, Math.min(70, 50 - w / 2 + offset)),
          y: 14,
          w: Number(w.toFixed(2)),
          h,
          borderRadius: 24
        }, 0);
      } else newBlock = blockType === 'text'
        ? normalizeM2Block({
            id: 'blk-txt-' + Date.now(),
            type: 'text',
            x: Math.min(65, 52 + offset),
            y: Math.min(72, 38 + offset),
            w: 30,
            h: 16,
            html: 'ZONE DE TEXTE',
            fontSize: 26,
            align: 'center'
          }, 1)
        : normalizeM2Block({
            id: 'blk-vid-' + Date.now(),
            type: 'video',
            x: Math.min(55, 10 + offset),
            y: Math.min(60, 28 + offset),
            w: 34,
            h: 38,
            borderRadius: 42
          }, 0);

      list.push(newBlock);
      selectedM2BlockId = newBlock.id;
      saveCategoriesToStorage();
      renderCategoryPages(cat);

      // Image ou fenêtre web : on ouvre directement la fenêtre de réglage
      if (newBlock.type === 'image' && typeof openM2ImageModal === 'function') openM2ImageModal(pageId, newBlock.id);
      if (newBlock.type === 'embed' && typeof openM2EmbedModal === 'function') openM2EmbedModal(pageId, newBlock.id);
    }

    function deleteM2Block(pageId, blockId) {
      const { cat, page } = findActivePageAndBlock(pageId, blockId);
      if (!cat || !page) return;
      if (page.template === 'blank') {
        page.freeBlocks = getPageBlockList(page).filter(b => b.id !== blockId);
      } else {
        if (page.blocks.length <= 1) return;
        page.blocks = page.blocks.filter(b => b.id !== blockId);
      }
      if (selectedM2BlockId === blockId) selectedM2BlockId = null;
      saveCategoriesToStorage();
      renderCategoryPages(cat);
    }

    function applyM2VideoPresetRatio(pageId, blockId, ratioStr) {
      const { cat, block } = findActivePageAndBlock(pageId, blockId);
      if (!cat || !block) return;

      const vw = window.innerWidth || 1920;
      const vh = window.innerHeight || 1080;

      if (ratioStr === '16:9') {
        block.w = 40;
        const pxW = (block.w / 100) * vw;
        const pxH = pxW * (9 / 16);
        block.h = Number(Math.min(82, (pxH / vh) * 100).toFixed(2));
      } else if (ratioStr === '9:16') {
        block.h = 66;
        const pxH = (block.h / 100) * vh;
        const pxW = pxH * (9 / 16);
        block.w = Number(Math.min(55, (pxW / vw) * 100).toFixed(2));
      } else if (ratioStr === '1:1') {
        block.h = 50;
        const pxH = (block.h / 100) * vh;
        block.w = Number(Math.min(55, (pxH / vw) * 100).toFixed(2));
      }

      block.x = Math.max(2, Math.min(98 - block.w, block.x));
      block.y = Math.max(2, Math.min(98 - block.h, block.y));
      saveCategoriesToStorage();
      renderCategoryPages(cat);
    }

    function toggleM2TextFormat(pageId, blockId, formatType) {
      const { block } = findActivePageAndBlock(pageId, blockId);
      if (!block) return;

      const blockEl = document.querySelector(`.m2-block[data-page-id="${pageId}"][data-block-id="${blockId}"]`);
      const textEl = blockEl ? blockEl.querySelector('.m2-text-content') : null;

      const sel = window.getSelection();
      const hasRangeSelection = sel && !sel.isCollapsed && textEl && textEl.contains(sel.anchorNode);

      if (hasRangeSelection) {
        document.execCommand(formatType, false, null);
        block.html = textEl.innerHTML;
      } else {
        block[formatType] = !block[formatType];
        if (textEl) {
          textEl.classList.toggle(`is-${formatType}`, block[formatType]);
        }
        if (blockEl) {
          renderCategoryPages(categories.find(c => c.id === activeCategoryPageId));
        }
      }
      saveCategoriesToStorage();
    }

    function changeM2TextAlign(pageId, blockId, alignVal) {

      if (!cat || !block) return;
      block.align = alignVal;
      saveCategoriesToStorage();
      renderCategoryPages(cat);

    function updateM2TextFontSize(pageId, blockId, sizePx) {
      const { block } = findActivePageAndBlock(pageId, blockId);
      if (!block) return;
      const clamped = Math.max(12, Math.min(96, parseInt(sizePx, 10) || 28));

      const blockEl = document.querySelector(`.m2-block[data-page-id="${pageId}"][data-block-id="${blockId}"]`);

        const textEl = blockEl.querySelector('.m2-text-content');

        if (textEl) textEl.style.fontSize = `${clamped}px`;

    function updateActiveM2FrameCrop(axis, val) {
      if (!activeM2EditPageId || !activeM2EditBlockId) return;
      const { block } = findActivePageAndBlock(activeM2EditPageId, activeM2EditBlockId);
      if (!block) return;

      const clamped = Math.max(0, Math.min(100, parseFloat(val) || 50));
      if (axis === 'x') {
        block.posX = clamped;
        document.getElementById('m2-frame-posx-label').textContent = `${Math.round(clamped)}%`;
      } else {
        block.posY = clamped;
        document.getElementById('m2-frame-posy-label').textContent = `${Math.round(clamped)}%`;
      }

      saveCategoriesToStorage();
      const blockEl = document.querySelector(`.m2-block[data-page-id="${activeM2EditPageId}"][data-block-id="${activeM2EditBlockId}"]`);
      if (blockEl) {
        const vid = blockEl.querySelector('.m2-video-el');
        if (vid) vid.style.objectPosition = `${block.posX ?? 50}% ${block.posY ?? 50}%`;
        const ytIfr = blockEl.querySelector('.m2-yt-iframe');
        if (ytIfr) {
          const offsetX = ((50 - (block.posX ?? 50)) * 0.5).toFixed(1);
          const offsetY = ((50 - (block.posY ?? 50)) * 0.5).toFixed(1);
          ytIfr.style.transform = `translate(${offsetX}%, ${offsetY}%) translate(-50%, -50%)`;

    function toggleM2VideoSoundFromBar(btnEl) {
      const frame = btnEl.closest('.m2-video-frame');
      const videoEl = frame ? frame.querySelector('.m2-video-el') : null;
      if (!videoEl) return;
      videoEl.muted = !videoEl.muted;
      syncM2PlayerUI(videoEl);
    }

    function handleM2VideoTimeUpdate(videoEl) {
      const frame = videoEl.closest('.m2-video-frame');
      if (!frame) return;
      const slider = frame.querySelector('.m2-timeline-slider');
      const timeLabel = frame.querySelector('.m2-time-readout');
      if (slider && videoEl.duration) {
        slider.value = ((videoEl.currentTime / videoEl.duration) * 100).toFixed(1);
      }
      if (timeLabel && videoEl.duration) {
        timeLabel.textContent = `${formatMediaSeconds(videoEl.currentTime)} / ${formatMediaSeconds(videoEl.duration)}`;
      }
      syncM2PlayerUI(videoEl);
    }

    function seekM2Video(sliderEl) {
      const frame = sliderEl.closest('.m2-video-frame');
      const videoEl = frame ? frame.querySelector('.m2-video-el') : null;
      if (!videoEl || !videoEl.duration) return;
      videoEl.currentTime = (parseFloat(sliderEl.value) / 100) * videoEl.duration;
    }

    function requestM2VideoFullscreen(btnEl) {
      const frame = btnEl.closest('.m2-video-frame');
      if (!frame) return;
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsEl) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      }
    }

    function syncM2PlayerUI(videoEl) {
      const frame = videoEl.closest('.m2-video-frame');
      if (!frame) return;
      const playBtn = frame.querySelector('.m2-btn-play');
      const muteBtn = frame.querySelector('.m2-btn-mute');
      const toast = frame.querySelector('.m2-sound-toast');

      frame.classList.toggle('is-paused', videoEl.paused);
      if (playBtn) playBtn.textContent = videoEl.paused ? '▶' : '❚❚';
      if (muteBtn) muteBtn.textContent = videoEl.muted ? '🔇' : '🔊';
      if (toast) {
        toast.textContent = videoEl.muted ? '🔇 Cliquer sur la vidéo pour le son' : '🔊 Son activé (cliquer pour couper)';
      }
    }

    function handleM2YouTubeClick(e, wrapEl) {
      if (isEditorMode) return;
      e.stopPropagation();
      const frame = wrapEl.closest('.m2-video-frame');
      const iframe = frame ? frame.querySelector('.m2-yt-iframe') : null;
      if (!iframe) return;

      const isCurrentlyMuted = iframe.dataset.muted !== 'false';
      if (isCurrentlyMuted) {
        sendYouTubeCommand(iframe, 'unMute');
        sendYouTubeCommand(iframe, 'setVolume', [100]);
        iframe.dataset.muted = 'false';
      } else {
        sendYouTubeCommand(iframe, 'mute');
        iframe.dataset.muted = 'true';
      }
      if (iframe.dataset.userPaused === 'true') {
        sendYouTubeCommand(iframe, 'playVideo');
        iframe.dataset.userPaused = 'false';
      }
      syncM2YouTubeUI(frame, iframe);
    }

    function toggleM2YouTubePlayPause(btnEl) {
      const frame = btnEl.closest('.m2-video-frame');
      const iframe = frame ? frame.querySelector('.m2-yt-iframe') : null;
      if (!iframe) return;

      const isPaused = iframe.dataset.userPaused === 'true';
      if (isPaused) {
        sendYouTubeCommand(iframe, 'playVideo');
        iframe.dataset.userPaused = 'false';
      } else {
        sendYouTubeCommand(iframe, 'pauseVideo');
        iframe.dataset.userPaused = 'true';
      }
      syncM2YouTubeUI(frame, iframe);
    }

    function toggleM2YouTubeSoundFromBar(btnEl) {
      const frame = btnEl.closest('.m2-video-frame');
      const iframe = frame ? frame.querySelector('.m2-yt-iframe') : null;
      if (!iframe) return;

      const isCurrentlyMuted = iframe.dataset.muted !== 'false';
      if (isCurrentlyMuted) {
        sendYouTubeCommand(iframe, 'unMute');
        sendYouTubeCommand(iframe, 'setVolume', [100]);
        iframe.dataset.muted = 'false';
      } else {
        sendYouTubeCommand(iframe, 'mute');
        iframe.dataset.muted = 'true';
      }
      syncM2YouTubeUI(frame, iframe);
    }

    function requestM2FrameFullscreen(btnEl) {
      const frame = btnEl.closest('.m2-video-frame');
      if (!frame) return;
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsEl) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      document.querySelectorAll('.m2-btn-fullscreen').forEach(btn => {
        btn.textContent = isFs ? '🗗' : '⛶';
      });
    });

    function toggleM2QualityMenu(e, btnEl) {
      e.stopPropagation();
      const wrap = btnEl.closest('.m2-quality-wrap');
      const menu = wrap ? wrap.querySelector('.m2-quality-menu') : null;
      if (!menu) return;
      const wasOpen = menu.classList.contains('is-open');
      document.querySelectorAll('.m2-quality-menu.is-open').forEach(m => m.classList.remove('is-open'));
      if (!wasOpen) menu.classList.add('is-open');
    }

    function setM2YouTubeQuality(optBtn, qualityCode, labelText) {
      const frame = optBtn.closest('.m2-video-frame');
      const iframe = frame ? frame.querySelector('.m2-yt-iframe') : null;
      const wrap = optBtn.closest('.m2-quality-wrap');
      const menu = optBtn.closest('.m2-quality-menu');
      const badge = wrap ? wrap.querySelector('.m2-quality-badge') : null;

      if (menu) {
        menu.querySelectorAll('.m2-quality-opt').forEach(b => b.classList.remove('is-active'));
        optBtn.classList.add('is-active');
        menu.classList.remove('is-open');
      }
      if (badge) badge.textContent = labelText;

      if (iframe) {
        sendYouTubeCommand(iframe, 'setPlaybackQualityRange', [qualityCode, qualityCode]);
        sendYouTubeCommand(iframe, 'setPlaybackQuality', [qualityCode]);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.m2-quality-wrap')) {
        document.querySelectorAll('.m2-quality-menu.is-open').forEach(m => m.classList.remove('is-open'));
      }
    });

    function syncM2YouTubeUI(frame, iframe) {
      if (!frame || !iframe) return;
      const isPaused = iframe.dataset.userPaused === 'true';
      const isMuted = iframe.dataset.muted !== 'false';
      const playBtn = frame.querySelector('.m2-btn-play');
      const muteBtn = frame.querySelector('.m2-btn-mute');
      const toast = frame.querySelector('.m2-sound-toast');

      frame.classList.toggle('is-paused', isPaused);
      if (playBtn) playBtn.textContent = isPaused ? '▶' : '❚❚';
      if (muteBtn) muteBtn.textContent = isMuted ? '🔇' : '🔊';
      if (toast) {
        toast.textContent = isMuted ? '🔇 Cliquer sur la vidéo pour le son' : '🔊 Son activé (cliquer pour couper)';
      }
    }

    function formatMediaSeconds(sec) {
      if (!sec || !isFinite(sec) || sec < 0) return '0:00';
      const total = Math.floor(sec);
      const mins = Math.floor(total / 60);
      const rem = total % 60;
      return `${mins}:${rem < 10 ? '0' : ''}${rem}`;
    }

    function registerM2YouTubeBridge(iframeEl) {
      if (!iframeEl) return;
      const sendListening = () => {
        if (!iframeEl.contentWindow) return;
        try {
          iframeEl.contentWindow.postMessage(JSON.stringify({
            event: 'listening',
            id: iframeEl.id || 'yt-player',
            channel: 'widget'
          }), '*');
          sendYouTubeCommand(iframeEl, 'setPlaybackQualityRange', ['hd1080', 'hd2160']);
          sendYouTubeCommand(iframeEl, 'setPlaybackQuality', ['hd1080']);
        } catch (e) {}
      };
      sendListening();
      setTimeout(sendListening, 600);
      setTimeout(sendListening, 1600);
    }

    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'string') return;
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (!data || data.event !== 'infoDelivery' || !data.info) return;

      let targetIframe = null;
      if (data.id) {
        targetIframe = document.getElementById(data.id);
      }
      if (!targetIframe) {
        document.querySelectorAll('.m2-yt-iframe').forEach(ifr => {
          if (ifr.contentWindow === event.source) targetIframe = ifr;
        });
      }
      if (!targetIframe) return;

      if (typeof data.info.duration === 'number' && data.info.duration > 0) {
        targetIframe.dataset.duration = String(data.info.duration);
      }
      if (typeof data.info.currentTime === 'number') {
        targetIframe.dataset.currentTime = String(data.info.currentTime);
      }

      const dur = parseFloat(targetIframe.dataset.duration) || 0;
      const cur = parseFloat(targetIframe.dataset.currentTime) || 0;
      const frame = targetIframe.closest('.m2-video-frame');
      if (!frame || dur <= 0) return;

      const slider = frame.querySelector('.m2-timeline-slider');
      const timeLabel = frame.querySelector('.m2-time-readout');

      if (slider && slider.dataset.dragging !== 'true') {
        slider.value = Math.min(100, Math.max(0, (cur / dur) * 100)).toFixed(2);
      }
      if (timeLabel) {
        timeLabel.textContent = `${formatMediaSeconds(cur)} / ${formatMediaSeconds(dur)}`;
      }
    });

    function seekM2YouTube(sliderEl) {
      const frame = sliderEl.closest('.m2-video-frame');
      const iframe = frame ? frame.querySelector('.m2-yt-iframe') : null;
      if (!iframe) return;

      registerM2YouTubeBridge(iframe);
      const dur = parseFloat(iframe.dataset.duration) || 120;
      const targetSec = (parseFloat(sliderEl.value) / 100) * dur;
      iframe.dataset.currentTime = String(targetSec);

      sendYouTubeCommand(iframe, 'seekTo', [targetSec, true]);

      const timeLabel = frame.querySelector('.m2-time-readout');
      if (timeLabel && parseFloat(iframe.dataset.duration) > 0) {
        timeLabel.textContent = `${formatMediaSeconds(targetSec)} / ${formatMediaSeconds(dur)}`;
      }
    }

    function openModal(id) {
      const m = document.getElementById(id);
      if (!m) return;
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (!m) return;
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /*************************************************************************
     * 7. INITIALISATION AU CHARGEMENT
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof DEFAULT_HOVER_MODE === 'string') {
        document.body.setAttribute('data-hover-mode', DEFAULT_HOVER_MODE);
        const hoverSel = document.getElementById('hover-mode-select');
        if (hoverSel) hoverSel.value = DEFAULT_HOVER_MODE;
      }
      if (typeof DEFAULT_RESTING_OPACITY === 'number') {
        const pct = Math.round(DEFAULT_RESTING_OPACITY * 100);
        const opSlider = document.getElementById('resting-opacity-slider');
        const opLabel = document.getElementById('resting-opacity-label');
        if (opSlider) opSlider.value = pct;
        if (opLabel) opLabel.textContent = `${pct}%`;
      }
      applyCategoryScrollModeUI();
      buildInfiniteCarousel();
      requestAnimationFrame(animateCarouselLoop);
      startIntroAnimation(false);
    });

  </script>
</body></html>
